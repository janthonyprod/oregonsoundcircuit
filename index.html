<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Policy Tracker</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--stock:#e6e7e2;--stock-raised:#eceee9;--stock-hover:#dcddd7;--ink:#141414;--flood:#f0451f;--flood-text:#c3350f;--rule-soft:#c9cac4}
*{box-sizing:border-box}
body{margin:0;background:var(--stock);color:var(--ink);font-family:'Spline Sans',system-ui,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--flood)}
a:hover{background:var(--flood);color:var(--stock)}
input,button,textarea{font:inherit;color:inherit}
input::placeholder{color:var(--ink);opacity:.4}
button{cursor:pointer;border-radius:0}
[hidden]{display:none!important}
p{text-wrap:pretty}
.anton{font-family:Anton,sans-serif;font-weight:400;font-style:normal;text-transform:uppercase}
.micro{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.tnum{font-feature-settings:'tnum' 1}
.tbtn{background:none;border:0;padding:0;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid var(--flood)}
.tbtn:hover{background:var(--flood);color:var(--stock)}
/* sign-in */
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{border:2px solid var(--ink);padding:30px 28px;max-width:400px;width:100%;background:var(--stock)}
.login-box h1{font-family:Anton,sans-serif;font-weight:400;font-size:26px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 2px;line-height:1}
.login-box .sub{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin:8px 0 20px}
.login-box input{width:100%;padding:9px 11px;border:2px solid var(--ink);background:var(--stock);font-size:14px;margin-bottom:10px;border-radius:0}
.login-box input:focus{outline:2px solid var(--flood);outline-offset:0}
.err{color:var(--flood-text);font-size:13px;font-weight:600;margin-bottom:10px;display:none}
.solid{background:var(--ink);color:var(--stock);border:2px solid var(--ink);padding:8px 16px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.solid:hover{background:var(--flood);border-color:var(--flood)}
/* header */
.top{background:var(--ink);color:var(--stock);padding:9px 22px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.brand{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.wordmark{font-family:Anton,sans-serif;font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.topmeta{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.topmeta a,.topmeta button{color:inherit;background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;border-bottom:1.5px solid transparent}
.topmeta button{opacity:1}
.topmeta button:hover{border-bottom-color:var(--stock)}
/* attention band */
.band{display:flex;flex-wrap:wrap;border-bottom:3px solid var(--ink)}
.cell{flex:0 1 250px;min-width:210px;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 18px;background:transparent;color:var(--ink);border:0;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.cell.on{background:var(--flood);color:var(--stock)}
.cell.on .lbl{opacity:1}
.cell .num{font-family:Anton,sans-serif;font-weight:400;font-size:40px;line-height:.9;font-feature-settings:'tnum' 1}
.cell .lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;max-width:22ch}
.cell.static{flex:1 1 240px;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;cursor:default}
.cell.static .line{font-size:13.5px;line-height:1.35;text-wrap:pretty}
/* filter bar */
.bar{border-bottom:3px solid var(--ink);padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.tabs{display:flex;flex-wrap:wrap}
.tab{background:transparent;color:var(--ink);border:2px solid var(--ink);border-right-width:0;padding:6px 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tab:last-child{border-right-width:2px}
.tab.on{background:var(--ink);color:var(--stock)}
.tab .n{opacity:.55;font-feature-settings:'tnum' 1;margin-left:4px}
.tab.on .n{opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:4px 9px;font-size:11px;font-weight:600;letter-spacing:.06em}
.chip.on{background:var(--ink);color:var(--stock)}
.bar input{flex:1 1 200px;min-width:170px;background:var(--stock);border:2px solid var(--ink);border-radius:0;padding:6px 9px;font-size:13.5px;-webkit-appearance:none}
.bar input:focus{outline:2px solid var(--flood);outline-offset:0}
/* list */
main{padding:0 18px 70px}
.sec{margin-top:26px}
.sechead{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:7px}
.sechead h2{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:21px;letter-spacing:.05em;text-transform:uppercase}
.sechead h2 .n{opacity:.4;margin-left:4px}
.cols{display:grid;grid-template-columns:100px minmax(0,1fr) 128px 96px;gap:0 14px;align-items:baseline;padding:7px 10px 6px;border-bottom:1px solid var(--ink);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.cols .r{text-align:right}
.wrap{border-bottom:1px solid var(--ink);border-left:4px solid transparent}
.wrap.dated{border-left-color:var(--flood)}
.wrap.flagged{border-left-color:var(--ink)}
.wrap.open{background:var(--stock-raised)}
.row{display:grid;grid-template-columns:100px minmax(0,1fr) 128px 96px;gap:0 14px;align-items:center;padding:11px 10px;cursor:pointer;transition:background .12s}
.row:hover{background:var(--stock-hover)}
.row:focus-visible{outline:2px solid var(--flood);outline-offset:-2px}
.c1{display:flex;align-items:baseline;gap:7px;min-width:0}
.jur{background:var(--ink);color:var(--stock);font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:2px 4px;flex:0 0 auto}
.num{font-family:Anton,sans-serif;font-weight:400;font-size:16px;letter-spacing:.01em;white-space:nowrap;text-transform:uppercase}
.c2{min-width:0}
.short{font-size:14px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marks{margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.state{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1.5px solid var(--ink);white-space:nowrap}
.state.committee{background:var(--ink);color:var(--stock)}
.state.review{border-color:var(--flood);color:var(--flood-text)}
.state.notrel{opacity:.7}
.urgent{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;background:var(--flood);color:var(--stock);white-space:nowrap}
.mini{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7;white-space:nowrap}
.pipe{display:flex;gap:2px;align-items:center}
.seg{width:15px;height:7px;border:1px solid var(--ink);display:inline-block}
.seg.on{background:var(--ink)}
.stagel{margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.75;line-height:1.2}
.c4{text-align:right;font-size:12.5px;font-weight:500;font-feature-settings:'tnum' 1;opacity:.8;white-space:nowrap}
/* expanded row */
.panel{border-top:2px solid var(--ink);padding:16px 14px 18px;background:var(--stock-raised);cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--rule-soft)}
.actions .sp{flex:1}
.actions a,.actions .lnk{font-size:12px;font-weight:600;letter-spacing:.06em;background:none;border:0;border-bottom:1.5px solid var(--flood);padding:0}
.actions .lnk:hover{background:var(--flood);color:var(--stock)}
.b{padding:7px 14px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:transparent;color:var(--ink);white-space:nowrap}
.b.primary{background:var(--flood);border-color:var(--flood);color:var(--stock)}
.b.set{background:var(--ink);border-color:var(--ink);color:var(--stock)}
.b.quiet{border-color:transparent;border-bottom-color:var(--ink);opacity:.8;padding:7px 10px}
.b.quiet:hover{opacity:1}
.pos{display:flex}
.pos .b{border-right-width:0;padding:7px 11px}
.pos .b:last-child{border-right-width:2px}
.note-line{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.edit{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.edit input{background:var(--stock);border:2px solid var(--ink);border-radius:0;padding:7px 9px;font-size:13.5px;min-width:0;opacity:1}
.edit .st{flex:1 1 300px}
.edit .hint{flex:1 1 100%;font-size:12px;opacity:.7;margin-top:-4px}
.body{display:flex;flex-wrap:wrap;gap:24px;padding-top:14px}
.left{flex:1 1 340px;min-width:260px}
.right{flex:0 1 300px;min-width:230px}
.summary{margin:0;font-size:14.5px;line-height:1.5}
.official{margin:0;font-size:12.5px;line-height:1.45;opacity:.78}
.h{margin:14px 0 5px}
.h.first{margin-top:0}
.more{display:none;margin:8px 0 0;font-size:13px;line-height:1.5;white-space:pre-wrap;max-height:300px;overflow:auto;opacity:.85}
dl.meta{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 18px}
dl.meta dt{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:3px}
dl.meta dd{margin:0;font-size:13px;font-weight:500;line-height:1.35;text-wrap:pretty}
.recent{margin-top:14px;border-top:1px solid var(--rule-soft);padding-top:10px}
.act{display:flex;gap:10px;font-size:12.5px;line-height:1.5}
.act .d{font-weight:600;font-feature-settings:'tnum' 1;white-space:nowrap;flex:0 0 72px}
.act .t{opacity:.8;min-width:0}
.why{margin-top:14px;font-size:12px;line-height:1.5;opacity:.8}
.why summary{cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.thread{margin-top:18px;border-top:2px solid var(--ink);padding-top:14px}
.thread .head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.thread .head .t{font-family:Anton,sans-serif;font-weight:400;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.entry{border-left:3px solid var(--ink);padding:0 0 0 11px;margin-bottom:11px}
.entry p{margin:0;font-size:13.5px;line-height:1.45}
.entry .who{margin-top:3px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.entry .who button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;border-bottom:1.5px solid var(--flood);margin-left:8px}
.mark-entry{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:9px;padding-left:14px}
.compose{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.compose input{flex:1 1 260px;min-width:200px;background:var(--stock);border:2px solid var(--ink);border-radius:0;padding:8px 10px;font-size:13.5px}
.compose input:focus{outline:2px solid var(--flood);outline-offset:0}
.post{background:var(--ink);color:var(--stock);border:2px solid var(--ink);padding:8px 16px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.none{margin:44px 0;font-size:15px;font-weight:500}
.none span{opacity:.55}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.loading{margin:30px 0;font-size:13px;opacity:.6}
footer{margin:40px 18px 0;padding:12px 0 40px;font-size:12px;line-height:1.6;opacity:.7;max-width:90ch;text-wrap:pretty;border-top:1px solid var(--ink)}
@media (max-width:640px){
  .top{padding:9px 14px}
  .bar{padding:10px 14px}
  main{padding:0 14px 60px}
  footer{margin:40px 14px 0}
  .cols{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 8px}
  .c1{grid-column:1;grid-row:1}
  .c4{grid-column:2;grid-row:1}
  .c2{grid-column:1 / -1;grid-row:2}
  .c3{grid-column:1 / -1;grid-row:3;display:flex;gap:10px;align-items:center}
  .stagel{margin-top:0}
  .short{white-space:normal}
  .panel{padding:14px 10px 16px}
}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="login-box">
    <h1>Policy Tracker</h1>
    <div class="sub">Members only</div>
    <div id="loginErr" class="err">Sign-in failed</div>
    <input type="email" id="email" placeholder="Email" autocomplete="username">
    <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" class="solid" style="width:100%">Sign in</button>
    <button id="backBtn" class="tbtn" style="display:none;margin-top:16px">Back to the tracker</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="wordmark">Policy Tracker</span></div>
    <div class="topmeta">
      <span>Music Oregon · AI policy committee</span>
      <span id="scanStamp"></span>
      <button id="whoBtn" type="button"></button>
    </div>
  </header>

  <section class="band">
    <button class="cell" id="cellReview" type="button"><span class="num" id="nReview">0</span><span class="lbl">Needs review · committee has not marked these</span></button>
    <button class="cell" id="cellDated" type="button"><span class="num" id="nDated">0</span><span class="lbl">Hearing or deadline inside 14 days</span></button>
    <div class="cell static"><span class="micro">Tracking</span><span class="line" id="tracking"></span></div>
  </section>

  <section class="bar">
    <div class="tabs" id="tabs"></div>
    <div class="chips"><span class="micro">Topic</span><span id="topicChips" class="chips"></span></div>
    <div class="chips"><span class="micro">Where</span><span id="whereChips" class="chips"></span></div>
    <input type="search" id="search" placeholder="Search number, title, sponsor" aria-label="Search">
    <button class="tbtn" id="resetBtn" type="button">Reset</button>
  </section>

  <main id="list"></main>
  <footer id="foot"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// Publishable key only. Every read and write is gated by Supabase Auth plus
// row level security on the leg_ tables; without a session the API returns nothing
// unless the committee has opened anonymous reads for a while (public read-only mode).
var SB_URL = 'https://ybfaykwwnirjwabmgsqu.supabase.co';
var SB_KEY = 'sb_publishable__doHKn0KYVVPUnYqVdchnw_TBUq5eYy';
var sb = window.supabase.createClient(SB_URL, SB_KEY);
var $ = function(id){ return document.getElementById(id); };

// bill dates are plain calendar dates, so compare against the member's local day, not UTC
function localDay(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
var TODAY = localDay(new Date());
var SOON = localDay(new Date(Date.now() + 14 * 86400000));
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// "Sep 9" this year, "Jun 5, 2025" otherwise; full=true always spells the year
function fmt(d, full){
  if (!d) return '';
  d = String(d).slice(0, 10);
  var p = d.split('-'), y = +p[0], m = +p[1], day = +p[2];
  if (!y || !m || !day) return d;
  return MONTHS[m - 1] + ' ' + day + ((full || y !== +TODAY.slice(0, 4)) ? ', ' + y : '');
}
function pad2(n){ return ('0' + n).slice(-2); }
function stamp(iso){ var d = new Date(iso); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()) + ' UTC'; }

var COLS = 'id,source,kind,jurisdiction,session_name,bill_number,bill_key,external_id,title,description,url,source_url,agency,' +
  'sponsor_summary,introduced_at,last_action_at,last_action,next_event_at,comments_close_on,effective_on,text_url,status_stage,lane,' +
  'match_terms,noise_rule,related,review_status,reviewed_by,reviewed_at,calendar';
// editorial fields added by the redesign; the page still works before the SQL that adds them has run
var EDIT_COLS = 'short_title,urgent_label,urgent_on,committee_position';
var LANES = ['ai_music', 'ticketing', 'ai_general', 'music_policy'];  // lane "other" is below the relevance floor and never shown
var TOPICS = ['ai_music', 'ticketing'];
var LANE_LABEL = {ai_music: 'AI + Music', ticketing: 'Ticketing', ai_general: 'AI, not music', music_policy: 'Music industry, no AI'};
var STAGES = ['Introduced', 'Committee', 'Floor', 'Passed', 'Enacted'];
var RULE_STAGES = ['Notice', 'Proposed', 'Final'];
// status_stage -> [pipeline position, stage name]; -1 fills no segment
var PIPE = {prefiled: [0, 'Prefiled'], introduced: [0, 'Introduced'], committee: [1, 'In committee'], floor: [2, 'On the floor'],
  passed_chamber: [2, 'One chamber'], passed_both: [3, 'Passed both'], enacted: [4, 'Enacted'], vetoed: [3, 'Vetoed'],
  dead: [-1, 'Did not pass'], unknown: [-1, 'No detail yet']};
var RULE_PIPE = {notice: [0, 'Notice'], proposed: [1, 'Proposed'], final: [2, 'Final rule']};
var RANK = {enacted: 9, final: 9, passed_both: 8, vetoed: 7, passed_chamber: 6, floor: 5, proposed: 5, committee: 4, notice: 4, introduced: 3, prefiled: 2, unknown: 1, dead: 0};
var TABS = [['active', 'Active'], ['enacted', 'Enacted'], ['watch', 'Watchlist'], ['notrel', 'Not relevant'], ['dead', 'Did not pass']];
var TOPIC_CHIPS = [['all', 'Both topics'], ['ai_music', 'AI + Music'], ['ticketing', 'Ticketing']];
var WHERE_CHIPS = [['all', 'All'], ['OR', 'Oregon'], ['US', 'Federal'], ['other', 'Other states']];
var WHERE_LABEL = {OR: 'Oregon', US: 'Federal', other: 'Other states'};
var POSITIONS = [['support', 'Support'], ['oppose', 'Oppose'], ['watch', 'Watch']];
var POS_LABEL = {support: 'Support', oppose: 'Oppose', watch: 'Watch'};

var state = {tab: 'active', topic: 'all', where: 'all', q: '', quick: null, open: null};
var user = null, uid = null, publicMode = false, schemaReady = true, threadReady = true, marksReady = true;
var bills = [], billById = {}, groupOf = {}, marks = {}, threads = {}, lastRun = null, editing = null;

function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function btn(t, cls, fn){ var b = el('button', cls, t); b.type = 'button'; b.onclick = function(e){ e.stopPropagation(); fn(e); }; return b; }
function isTopic(b){ return TOPICS.indexOf(b.lane) >= 0; }
function isRule(b){ return b.source === 'federal_register'; }
function isEnacted(b){ return b.status_stage === 'enacted' || b.status_stage === 'final'; }
function whereOf(b){ return b.jurisdiction === 'OR' ? 'OR' : b.jurisdiction === 'US' ? 'US' : 'other'; }
function flagged(b){ return b.review_status === 'relevant' || b.review_status === 'watch'; }
// a private mark on any version counts for the whole companion group
function isMine(b){ return (groupOf[b.id] || [b]).some(function(x){ return !!marks[x.id]; }); }
function position(b){ return schemaReady && b.committee_position ? b.committee_position : null; }
function statusOf(b){
  if (b.review_status === 'dismissed' || b.review_status === 'noise' || !isTopic(b)) return 'notrel';
  if (b.status_stage === 'dead' || b.status_stage === 'vetoed') return 'dead';
  if (isEnacted(b)) return 'enacted';
  return 'active';
}
function needsReview(b){ return statusOf(b) === 'active' && !flagged(b) && !isMine(b) && !position(b); }
// the next dated event: a member-entered deadline, a comment window, or a hearing the scan stored
function datedOf(b){
  var out = [];
  if (schemaReady && b.urgent_on && b.urgent_on >= TODAY) out.push({date: b.urgent_on, label: b.urgent_label || 'Deadline', manual: true});
  if (b.comments_close_on && b.comments_close_on >= TODAY) out.push({date: b.comments_close_on, label: 'Comments close'});
  if (b.next_event_at && b.next_event_at >= TODAY) out.push({date: b.next_event_at, label: 'Hearing'});
  (b.calendar || []).forEach(function(c){ if (c && c.date && String(c.date).slice(0, 10) >= TODAY) out.push({date: String(c.date).slice(0, 10), label: c.type || 'Hearing'}); });
  out.sort(function(a, c){ return a.date < c.date ? -1 : a.date > c.date ? 1 : 0; });
  return out[0] || null;
}
function inWindow(b){ var d = datedOf(b); return !!d && d.date <= SOON; }
function pipeOf(b){
  var rule = isRule(b), map = rule ? RULE_PIPE : PIPE, names = rule ? RULE_STAGES : STAGES;
  var hit = map[b.status_stage] || [-1, 'Detail pending'];
  return {n: names.length, at: hit[0], label: hit[1]};
}
function rankSort(a, b){
  var r = (RANK[b.status_stage] || 0) - (RANK[a.status_stage] || 0);
  if (r) return r;
  var x = a.last_action_at || '', y = b.last_action_at || '';
  return y > x ? 1 : y < x ? -1 : 0;
}
function dateSort(a, b){ var x = a.last_action_at || '', y = b.last_action_at || ''; return y > x ? 1 : y < x ? -1 : 0; }
function lawSort(a, b){ var x = a.effective_on || a.last_action_at || '', y = b.effective_on || b.last_action_at || ''; return y > x ? 1 : y < x ? -1 : 0; }
// dated items lead (they can expire); then furthest along on the Active tab, most recent elsewhere
function groupSort(a, b){
  var da = datedOf(a), db = datedOf(b);
  if (da && !db) return -1;
  if (db && !da) return 1;
  if (da && db && da.date !== db.date) return da.date < db.date ? -1 : 1;
  return state.tab === 'active' ? rankSort(a, b) : state.tab === 'enacted' ? lawSort(a, b) : dateSort(a, b);
}

// Popular name for federal bills: LegiScan runs the short title and the long
// title together ("TICKET Act Transparency In Charges for ... Act"). Keep the
// leading name when it is short, otherwise the shortest segment ending in Act.
function actSegments(t){
  var segs = [], last = 0, re = /\bAct(?: of \d{4})?(?=\s|$)/g, m;
  while ((m = re.exec(t)) !== null){ var end = m.index + m[0].length; segs.push(t.slice(last, end).trim()); last = end; }
  if (last < t.length) segs.push(t.slice(last).trim());
  return segs.filter(Boolean);
}
function clip(t, n){ return t.length > n ? t.slice(0, n - 3).replace(/\s+\S*$/, '') + '…' : t; }
function autoTitle(b){
  var t = (b.title || '').trim().replace(/\s+/g, ' ').replace(/\.$/, '');
  if (b.jurisdiction !== 'US') return t;
  var cands = actSegments(t).filter(function(s){
    return /\bAct(?: of \d{4})?$/.test(s) && s.split(' ').length >= 2 && !/^(An|A|The)\s+Act\b/i.test(s) && !/^To\b/.test(s);
  });
  if (!cands.length) return t;
  if (cands[0].split(' ').length <= 6) return cands[0];
  cands.sort(function(a, c){ return a.length - c.length; });
  return cands[0];
}
// the editorial one-liner when a member has written one (for any version shown together), else the official caption
function shortOf(b, members){
  if (schemaReady){
    if (b.short_title) return b.short_title;
    for (var i = 0; i < (members || []).length; i++) if (members[i].short_title) return members[i].short_title;
  }
  return autoTitle(b);
}

// Two-sentence overview from the official summary already stored: the
// Oregon digest line, the CRS summary for federal bills, the agency abstract
// for rulemaking, the Legislative Counsel's digest for California. Nothing is generated.
function sentencesOf(text){
  var t = text.replace(/\b(e\.g|i\.e|U\.S|No|Sec|Secs|Ch|Rep|Sen|Dept|St|Mr|Ms|Dr|Inc|Ltd|Co|vs|etc|Art|Div|Subd|Para|Pub|Stat)\.(?=\s)/g, function(m){ return m.replace(/\./g, '․'); });
  var out = [], start = 0;
  for (var i = 0; i < t.length; i++){
    var ch = t.charAt(i);
    if (ch !== '.' && ch !== '!' && ch !== '?') continue;
    var j = i + 1;
    while (j < t.length && /[)"'\]]/.test(t.charAt(j))) j++;
    if (j < t.length && !/\s/.test(t.charAt(j))) continue;
    var k = j;
    while (k < t.length && /\s/.test(t.charAt(k))) k++;
    if (k < t.length && !/[A-Z"(\[]/.test(t.charAt(k))) continue;
    out.push(t.slice(start, j).trim());
    start = k; i = k - 1;
  }
  if (start < t.length) out.push(t.slice(start).trim());
  return out.map(function(x){ return x.replace(/․/g, '.'); }).filter(Boolean);
}
function overviewOf(desc, max){
  if (!desc) return null;
  var t = desc.replace(/<[^>]+>/g, ' ').replace(/\(Flesch Readability Score:[^)]*\)\.?/g, '').replace(/^\s*Digest:\s*/i, '');
  var lines = t.split(/\n+/).map(function(x){ return x.trim(); }).filter(Boolean);
  if (lines.length > 1 && lines[0].length < 220 && !/[.!?]$/.test(lines[0])) lines.shift();
  var text = lines.join(' ').replace(/\s+/g, ' ').trim();
  if (!text) return null;
  var sentences = sentencesOf(text);
  var start = 0;
  for (var s = 0; s < sentences.length; s++){
    if (/^This (bill|act|measure|resolution)\b/.test(sentences[s])){ start = s; break; }
  }
  var out = '';
  for (var i = start; i < sentences.length && i < start + 2; i++){
    if (out && out.length >= 160) break;
    out += (out ? ' ' : '') + sentences[i];
  }
  out = clip(out, max || 420);
  var official = /^(an act\b|relating to\b|a bill\b|to amend\b|amends\b|an ordinance|a resolution|a joint resolution|concerning\b)/i.test(out);
  return {text: out, official: official, full: text};
}
function sameStart(a, b){
  a = (a || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  b = (b || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  var n = Math.min(60, a.length, b.length);
  return n > 30 && a.slice(0, n) === b.slice(0, n);
}
function termsOf(b){
  var out = [];
  (b.match_terms || '').split('|').forEach(function(part){
    var p = part.trim(); if (!p || /^(co|query)/.test(p)) return;
    p.replace(/^[a-z_]+:/, '').split(',').forEach(function(t){ t = t.trim(); if (t && out.indexOf(t) < 0 && out.length < 4) out.push(t); });
  });
  return out;
}
// Oregon bills arrive from both OLIS and LegiScan; keep the OLIS copy.
function dedupe(rows){
  var olis = {};
  rows.forEach(function(b){ if (b.source === 'olis' && b.bill_key) olis[b.bill_key] = true; });
  return rows.filter(function(b){ return !(b.source === 'legiscan' && b.bill_key && olis[b.bill_key]); });
}
// Companion bills (a House and a Senate version, or a refiled twin) are shown
// once. Linked by LegiScan's "Same As" relation, or by an identical title in
// the same jurisdiction and session. Grouping is per list: only versions that
// pass the same filters collapse together.
function titleKey(b){
  var t = b.jurisdiction === 'US' ? autoTitle(b) : (b.title || '');
  return b.jurisdiction + '|' + (b.session_name || '') + '|' + t.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
function buildGroups(rows){
  var parent = {}, byExt = {}, byTitle = {};
  function find(x){ while (parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function union(a, b){ a = find(a); b = find(b); if (a !== b) parent[a] = b; }
  rows.forEach(function(b){
    parent[b.id] = b.id;
    if (b.source === 'legiscan' && b.external_id != null) byExt[String(b.external_id)] = b;
    if (!isRule(b) && (b.title || '').trim().length >= 12){ var k = titleKey(b); (byTitle[k] = byTitle[k] || []).push(b); }
  });
  rows.forEach(function(b){
    (b.related || []).forEach(function(r){
      if (r.type !== 'Same As') return;
      var o = byExt[String(r.bill_id)];
      if (o && o.jurisdiction === b.jurisdiction) union(b.id, o.id);
    });
  });
  Object.keys(byTitle).forEach(function(k){ var g = byTitle[k]; for (var i = 1; i < g.length; i++) union(g[0].id, g[i].id); });
  var sets = {};
  rows.forEach(function(b){ var r = find(b.id); (sets[r] = sets[r] || []).push(b); });
  groupOf = {};
  Object.keys(sets).forEach(function(r){ if (sets[r].length > 1) sets[r].forEach(function(b){ groupOf[b.id] = sets[r]; }); });
}
// rows -> [{b: primary, members: [other versions present in this list]}]
function collapse(rows){
  var present = {}, seen = {}, out = [];
  rows.forEach(function(b){ present[b.id] = true; });
  rows.forEach(function(b){
    if (seen[b.id]) return;
    var g = groupOf[b.id];
    if (!g){ seen[b.id] = true; out.push({b: b, members: []}); return; }
    var mem = g.filter(function(x){ return present[x.id]; }).sort(rankSort);
    // a linked or opened version leads its group so its panel is the one that shows
    var i = mem.map(function(x){ return x.id; }).indexOf(state.open);
    if (i > 0) mem.unshift(mem.splice(i, 1)[0]);
    mem.forEach(function(x){ seen[x.id] = true; });
    out.push({b: mem[0], members: mem.slice(1)});
  });
  return out;
}
function versionIds(b, members){ return [b.id].concat((members || []).map(function(m){ return m.id; })); }
function threadOf(b, members){
  var out = [];
  versionIds(b, members).forEach(function(id){ (threads[id] || []).forEach(function(n){ out.push(n); }); });
  return out.sort(function(a, c){ return a.created_at < c.created_at ? -1 : a.created_at > c.created_at ? 1 : 0; });
}

// PostgREST caps a select at 1000 rows, so page through explicitly.
function fetchAll(build){
  var out = [];
  function page(from){
    return build().range(from, from + 999).then(function(r){
      if (r.error) throw r.error;
      out = out.concat(r.data || []);
      return (r.data && r.data.length === 1000) ? page(from + 1000) : out;
    });
  }
  return page(0);
}
function loadBills(){
  schemaReady = true;
  return fetchAll(function(){ return sb.from('leg_bills').select(COLS + ',' + EDIT_COLS).order('id'); }).catch(function(e){
    if (!/short_title|urgent_|committee_position/.test(e.message || '')) throw e;
    schemaReady = false;  // the redesign SQL has not run yet
    return fetchAll(function(){ return sb.from('leg_bills').select(COLS).order('id'); });
  });
}
function loadData(){
  $('list').innerHTML = '<div class="loading">Loading</div>';
  return Promise.all([
    loadBills(),
    sb.from('leg_runs').select('started_at').eq('kind', 'billscan').order('started_at', {ascending: false}).limit(1),
    user ? sb.from('leg_marks').select('id,bill_id,mark,note').limit(2000) : Promise.resolve({data: []}),
    user ? sb.from('leg_bill_notes').select('id,bill_id,kind,body,author,user_id,created_at').order('created_at').limit(5000) : Promise.resolve({data: []})
  ]).then(function(res){
    totalScanned = res[0].length;
    bills = dedupe(res[0]).filter(function(b){ return LANES.indexOf(b.lane) >= 0; });
    billById = {}; bills.forEach(function(b){ billById[b.id] = b; });
    buildGroups(bills);
    lastRun = res[1].data && res[1].data[0] ? res[1].data[0].started_at : null;
    marksReady = !res[2].error; marks = {};
    (res[2].data || []).forEach(function(m){ marks[m.bill_id] = m; });
    threadReady = !res[3].error; threads = {};
    (res[3].data || []).forEach(function(n){ (threads[n.bill_id] = threads[n.bill_id] || []).push(n); });
    if (state.open && !billById[state.open]) state.open = null;
    // a shared link to a bill lands on the tab that holds it
    if (state.open && !inTab(billById[state.open])){ state.tab = statusOf(billById[state.open]); state.quick = null; }
    render();
  }).catch(function(e){ $('list').innerHTML = '<div class="none">' + esc(e.message) + '</div>'; });
}

// ---------------------------------------------------------------- filters

function matchesQuery(b, members){
  var q = state.q;
  if (!q) return true;
  var hay = [b.bill_number, shortOf(b, members), b.title, b.sponsor_summary, b.agency, b.jurisdiction, WHERE_LABEL[whereOf(b)]]
    .concat((members || []).map(function(m){ return m.bill_number; })).join(' ').toLowerCase();
  return hay.indexOf(q) >= 0;
}
function inTab(b){
  if (state.tab === 'watch') return flagged(b) || isMine(b);
  return statusOf(b) === state.tab;
}
function pass(b){
  if (!inTab(b)) return false;
  if (state.topic !== 'all' && b.lane !== state.topic) return false;
  if (state.where !== 'all' && whereOf(b) !== state.where) return false;
  if (state.quick === 'review' && !needsReview(b)) return false;
  if (state.quick === 'dated' && !inWindow(b)) return false;
  return true;
}
function tabCount(key){
  var save = state.tab; state.tab = key;
  var n = collapse(bills.filter(inTab)).length;
  state.tab = save; return n;
}

// ---------------------------------------------------------------- rows

function chipFor(b){
  if (b.review_status === 'noise') return ['notrel', 'Hidden by rule'];
  if (b.review_status === 'dismissed') return ['notrel', 'Not relevant'];
  if (flagged(b)) return ['committee', position(b) ? 'Committee · ' + POS_LABEL[position(b)] : 'Committee'];
  if (!isTopic(b)) return ['notrel', LANE_LABEL[b.lane]];
  if (isMine(b)) return ['mine', 'My list'];
  if (statusOf(b) === 'active') return ['review', 'Needs review'];
  return null;
}
function pipeHtml(b){
  var p = pipeOf(b), h = '<div class="pipe" aria-hidden="true">';
  for (var i = 0; i < p.n; i++) h += '<span class="seg' + (i <= p.at ? ' on' : '') + '"></span>';
  return h + '</div><div class="stagel">' + esc(p.label) + '</div>';
}
function lastDate(b){
  if (isEnacted(b) && b.effective_on) return fmt(b.effective_on);
  return fmt(b.last_action_at);
}
function row(b, members){
  var d = datedOf(b), isOpen = state.open === b.id;
  var wrap = el('div', 'wrap' + (d ? ' dated' : flagged(b) ? ' flagged' : '') + (isOpen ? ' open' : ''));
  var r = el('div', 'row');
  r.setAttribute('role', 'button'); r.tabIndex = 0; r.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  var chip = chipFor(b), marksH = '';
  if (chip) marksH += '<span class="state ' + chip[0] + '">' + esc(chip[1]) + '</span>';
  if (flagged(b) && isMine(b)) marksH += '<span class="mini">On my list</span>';
  if (d) marksH += '<span class="urgent">' + esc(d.label + ' ' + fmt(d.date)) + '</span>';
  var notes = threadOf(b, members).filter(function(n){ return n.kind !== 'mark'; }).length;
  if (notes) marksH += '<span class="mini">' + notes + (notes === 1 ? ' note' : ' notes') + '</span>';
  if (members.length) marksH += '<span class="mini">+' + members.length + (members.length === 1 ? ' version' : ' versions') + '</span>';
  r.innerHTML = '<div class="c1"><span class="jur">' + esc(b.jurisdiction) + '</span><span class="num">' + esc(b.bill_number || '') + '</span></div>' +
    '<div class="c2"><div class="short" title="' + esc(b.title || '') + '">' + esc(shortOf(b, members)) + '</div><div class="marks">' + marksH + '</div></div>' +
    '<div class="c3">' + pipeHtml(b) + '</div>' +
    '<div class="c4">' + esc(lastDate(b)) + '</div>';
  var toggle = function(){ state.open = isOpen ? null : b.id; editing = null; render(); };
  r.onclick = toggle;
  r.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  wrap.appendChild(r);
  if (isOpen) wrap.appendChild(panel(b, members));
  return wrap;
}

function panel(b, members){
  var p = el('div', 'panel');
  p.onclick = function(e){ e.stopPropagation(); };
  var act = el('div', 'actions');
  var notrel = b.review_status === 'dismissed';
  if (user){
    if (notrel){
      act.appendChild(btn('Move back to active', 'b', function(){ setReview(b, members, 'new', 'Moved back to active'); }));
      act.appendChild(el('span', 'note-line', 'Not relevant' + (b.reviewed_by ? ' · ' + esc(b.reviewed_by) : '') + (b.reviewed_at ? ' · ' + esc(fmt(b.reviewed_at, true)) : '')));
    } else {
      var isF = flagged(b);
      act.appendChild(btn(isF ? 'Unflag for committee' : 'Flag for committee', 'b ' + (isF ? 'set' : 'primary'), function(){ setReview(b, members, isF ? 'new' : 'relevant', null); }));
      if (isF && schemaReady){
        var pos = el('div', 'pos');
        POSITIONS.forEach(function(x){
          pos.appendChild(btn(x[1], 'b' + (position(b) === x[0] ? ' set' : ''), function(){ setPosition(b, members, position(b) === x[0] ? null : x[0]); }));
        });
        act.appendChild(pos);
      }
      if (marksReady) act.appendChild(btn(isMine(b) ? 'On my list' : 'Add to my list', 'b' + (isMine(b) ? ' set' : ''), function(){ setMine(b, !isMine(b)); }));
      if (b.review_status === 'noise') act.appendChild(btn('Move back to active', 'b', function(){ setReview(b, members, 'new', 'Moved back to active'); }));
      else if (isTopic(b)) act.appendChild(btn('Not relevant', 'b quiet', function(){ setReview(b, members, 'dismissed', 'Marked not relevant'); }));
    }
  } else {
    act.appendChild(el('span', 'note-line', 'Committee members sign in to flag bills and post to the thread.'));
    act.appendChild(btn('Sign in', 'lnk', function(){ showLogin(); }));
  }
  act.appendChild(el('span', 'sp'));
  var official = b.source_url || b.url;
  if (official) act.appendChild(el('a', null, b.source_url || b.source !== 'legiscan' ? 'Official page' : 'Bill page (LegiScan)')).href = official;
  if (b.text_url && b.text_url !== official) act.appendChild(el('a', null, 'Bill text')).href = b.text_url;
  Array.prototype.forEach.call(act.querySelectorAll('a'), function(a){ a.target = '_blank'; a.rel = 'noopener'; });
  if (user && schemaReady) act.appendChild(btn(editing === b.id ? 'Close editor' : 'Edit details', 'lnk', function(){ editing = editing === b.id ? null : b.id; render(); }));
  p.appendChild(act);
  if (user && schemaReady && editing === b.id) p.appendChild(editForm(b));

  // plain language left, facts right
  var ov = overviewOf(b.description);
  var body = el('div', 'body');
  var left = el('div', 'left'), h = '';
  var title = (b.title || '').replace(/\s+/g, ' ').trim();
  if (ov && !sameStart(ov.text, title)){
    h += '<div class="micro h first">' + (ov.official ? 'Summary from the source' : 'Plain language') + '</div><p class="summary">' + esc(ov.text) + '</p>';
    if (ov.full.length > ov.text.length + 20) h += '<button type="button" class="tbtn showfull" style="margin-top:8px">Full summary</button><p class="more">' + esc(ov.full.slice(0, 8000)) + '</p>';
    h += '<div class="micro h">Official title</div><p class="official">' + esc(title) + '</p>';
  } else {
    h += '<div class="micro h first">Official title</div><p class="summary">' + esc(title) + '</p>';
    if (!ov) h += '<p class="official" style="margin-top:8px">No summary from the source yet. The title and the bill text are all it has published.</p>';
  }
  left.innerHTML = h;
  var sf = left.querySelector('.showfull'), full = left.querySelector('p.more');
  if (sf && full) sf.onclick = function(e){ e.stopPropagation(); full.style.display = full.style.display === 'block' ? 'none' : 'block'; sf.textContent = full.style.display === 'block' ? 'Hide summary' : 'Full summary'; };
  body.appendChild(left);

  var right = el('div', 'right');
  var meta = [];
  if (b.sponsor_summary) meta.push(['Sponsor', b.sponsor_summary]);
  if (b.agency) meta.push(['Agency', b.agency]);
  var intro = [];
  if (b.introduced_at) intro.push(fmt(b.introduced_at, true));
  if (b.session_name) intro.push(b.session_name);
  if (intro.length) meta.push([isRule(b) ? 'Published' : 'Introduced', intro.join(', ')]);
  if (b.effective_on) meta.push([b.effective_on <= TODAY ? 'In effect' : 'Effective', fmt(b.effective_on, true)]);
  var d = datedOf(b);
  if (d) meta.push([d.label, fmt(d.date, true)]);
  meta.push(['Jurisdiction', b.jurisdiction === 'US' ? 'Federal' : b.jurisdiction === 'OR' ? 'Oregon' : b.jurisdiction]);
  if (members.length) meta.push(['Other versions', members.map(function(m){ return m.bill_number + ' (' + (PIPE[m.status_stage] || RULE_PIPE[m.status_stage] || [0, 'detail pending'])[1].toLowerCase() + ')'; }).join(', ')]);
  var dl = el('dl', 'meta');
  meta.forEach(function(m){ dl.innerHTML += '<div><dt>' + esc(m[0]) + '</dt><dd>' + esc(m[1]) + '</dd></div>'; });
  right.appendChild(dl);
  right.appendChild(el('div', 'recent', '<div class="micro" style="margin-bottom:6px">Recent actions</div><div id="hist-' + b.id + '" class="note-line" style="text-transform:none;letter-spacing:0">Loading</div>'));
  body.appendChild(right);
  p.appendChild(body);

  // the keyword matcher's reasons, for rule tuning; members only
  if (user){
    var why = el('details', 'why');
    var terms = termsOf(b), bits = [];
    if (terms.length) bits.push('Matched terms: ' + esc(terms.join(', ')));
    if (b.noise_rule) bits.push('Hidden by rule: ' + esc(b.noise_rule));
    bits.push('Lane: ' + esc(LANE_LABEL[b.lane] || b.lane) + ' · source: ' + esc(b.source));
    why.innerHTML = '<summary>Why it surfaced</summary><div id="why-' + b.id + '" style="margin-top:6px">' + bits.join('<br>') + '</div>';
    p.appendChild(why);
  }

  p.appendChild(thread(b, members));
  loadHistory(b);
  return p;
}

function editForm(b){
  var f = el('div', 'edit');
  f.innerHTML = '<label class="st">Short title<input id="ed-short" maxlength="72" placeholder="One line, about 60 characters, what the bill does"></label>' +
    '<label>Upcoming event<input id="ed-label" maxlength="40" placeholder="Hearing, Work session, Comments close"></label>' +
    '<label>Date<input id="ed-date" type="date"></label>' +
    '<span class="hint">The event tag and the 14-day counter come from this date; the tag disappears by itself once the date has passed.</span>';
  f.querySelector('#ed-short').value = b.short_title || '';
  f.querySelector('#ed-label').value = b.urgent_label || '';
  f.querySelector('#ed-date').value = b.urgent_on || '';
  f.appendChild(btn('Save', 'b set', function(){
    var body = {short_title: f.querySelector('#ed-short').value.trim() || null, urgent_label: f.querySelector('#ed-label').value.trim() || null,
      urgent_on: f.querySelector('#ed-date').value || null};
    if (body.urgent_on && !body.urgent_label) body.urgent_label = 'Deadline';
    sb.from('leg_bills').update(body).eq('id', b.id).then(function(r){
      if (r.error){ alert('Save failed: ' + r.error.message); return; }
      Object.keys(body).forEach(function(k){ b[k] = body[k]; });
      editing = null; render();
    });
  }));
  f.appendChild(btn('Cancel', 'b quiet', function(){ editing = null; render(); }));
  return f;
}

function loadHistory(b){
  sb.from('leg_bills').select('history,subjects,current_location').eq('id', b.id).single().then(function(r){
    var d = $('hist-' + b.id); if (!d) return;
    if (r.error){ d.textContent = r.error.message; return; }
    var x = r.data || {}, hist = (x.history || []).slice().reverse();
    var line = function(s){ return '<div class="act"><span class="d">' + esc(fmt(s.date)) + '</span><span class="t">' + esc([s.chamber, s.action].filter(Boolean).join(' ')) + (s.vote ? ' (' + esc(s.vote) + ')' : '') + '</span></div>'; };
    var h = hist.slice(0, 3).map(line).join('');
    if (hist.length > 3) h += '<button type="button" class="tbtn allhist" style="margin-top:6px">Full history (' + hist.length + ')</button><div class="allhist-body" style="display:none;margin-top:6px">' + hist.slice(3).map(line).join('') + '</div>';
    d.className = ''; d.innerHTML = h || '<span class="note-line" style="text-transform:none;letter-spacing:0">No actions stored yet.</span>';
    var a = d.querySelector('.allhist'), body = d.querySelector('.allhist-body');
    if (a && body) a.onclick = function(e){ e.stopPropagation(); body.style.display = body.style.display === 'block' ? 'none' : 'block'; a.textContent = body.style.display === 'block' ? 'Hide history' : 'Full history (' + hist.length + ')'; };
    var why = $('why-' + b.id);
    if (why){
      if (x.current_location) why.innerHTML += '<br>Now in: ' + esc(x.current_location);
      if (x.subjects && x.subjects.length) why.innerHTML += '<br>Subjects: ' + esc(x.subjects.join(', '));
    }
  });
}

function thread(b, members){
  var t = el('div', 'thread');
  t.innerHTML = '<div class="head"><span class="t">Committee thread</span><span class="micro" style="opacity:.7">Visible to all members</span></div>';
  if (!user){
    t.appendChild(el('div', 'note-line', 'Sign in to read the thread.'));
    return t;
  }
  if (!threadReady){
    t.appendChild(el('div', 'note-line', 'The thread table is not set up yet.'));
    return t;
  }
  threadOf(b, members).forEach(function(n){
    if (n.kind === 'mark'){
      t.appendChild(el('div', 'mark-entry', esc(n.body) + ' · ' + esc(n.author || '') + ' · ' + esc(fmt(n.created_at, true))));
      return;
    }
    var e = el('div', 'entry', '<p>' + esc(n.body) + '</p><div class="who">' + esc(n.author || 'member') + ' · ' + esc(fmt(n.created_at, true)) + '</div>');
    if (uid && n.user_id === uid) e.querySelector('.who').appendChild(btn('Remove', null, function(){
      if (!confirm('Remove this note?')) return;
      sb.from('leg_bill_notes').delete().eq('id', n.id).then(function(r){
        if (r.error){ alert('Could not remove: ' + r.error.message); return; }
        threads[n.bill_id] = (threads[n.bill_id] || []).filter(function(x){ return x.id !== n.id; }); render();
      });
    }));
    t.appendChild(e);
  });
  var c = el('div', 'compose');
  var input = el('input'); input.placeholder = 'Add an insight for the committee'; input.maxLength = 2000;
  var post = function(){ var text = input.value.trim(); if (!text) return; postNote(b, 'note', text).then(function(ok){ if (ok) render(); }); };
  input.onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); post(); } };
  c.appendChild(input);
  c.appendChild(btn('Post', 'post', post));
  t.appendChild(c);
  return t;
}

// ---------------------------------------------------------------- writes

function postNote(b, kind, text){
  if (!threadReady) return Promise.resolve(false);
  var row = {bill_id: b.id, kind: kind, body: text, author: user, user_id: uid};
  return sb.from('leg_bill_notes').insert(row).select('id,bill_id,kind,body,author,user_id,created_at').then(function(r){
    if (r.error){ alert('Could not post: ' + r.error.message); return false; }
    var n = (r.data && r.data[0]) || Object.assign({id: Math.random(), created_at: new Date().toISOString()}, row);
    (threads[b.id] = threads[b.id] || []).push(n);
    return true;
  });
}
// a committee mark covers every version shown together, so a dismissed
// House bill does not resurface as its Senate twin
function setReview(b, members, status, marktext){
  var ids = versionIds(b, members);
  var body = {review_status: status, reviewed_by: user, reviewed_at: new Date().toISOString()};
  if (status !== 'relevant' && schemaReady) body.committee_position = null;
  sb.from('leg_bills').update(body).in('id', ids).then(function(r){
    if (r.error){ alert('Update failed: ' + r.error.message); return; }
    ids.forEach(function(id){ var x = billById[id]; if (x) Object.keys(body).forEach(function(k){ x[k] = body[k]; }); });
    if (marktext) postNote(b, 'mark', marktext).then(function(){ render(); });
    else render();
  });
}
function setPosition(b, members, pos){
  var ids = versionIds(b, members);
  var body = {committee_position: pos, reviewed_by: user, reviewed_at: new Date().toISOString()};
  sb.from('leg_bills').update(body).in('id', ids).then(function(r){
    if (r.error){ alert('Update failed: ' + r.error.message); return; }
    ids.forEach(function(id){ var x = billById[id]; if (x) Object.keys(body).forEach(function(k){ x[k] = body[k]; }); });
    postNote(b, 'mark', pos ? 'Position: ' + POS_LABEL[pos] : 'Position cleared').then(function(){ render(); });
  });
}
function setMine(b, add){
  if (add){
    sb.from('leg_marks').upsert({user_id: uid, bill_id: b.id, mark: 'watch', updated_at: new Date().toISOString()}, {onConflict: 'user_id,bill_id'})
      .select('id,bill_id,mark,note').then(function(r){
        if (r.error){ alert('Could not add: ' + r.error.message); return; }
        marks[b.id] = (r.data && r.data[0]) || {bill_id: b.id, mark: 'watch'}; render();
      });
  } else {
    var ids = (groupOf[b.id] || [b]).map(function(x){ return x.id; });
    sb.from('leg_marks').delete().in('bill_id', ids).then(function(r){
      if (r.error){ alert('Could not remove: ' + r.error.message); return; }
      ids.forEach(function(id){ delete marks[id]; }); render();
    });
  }
}

// ---------------------------------------------------------------- page

function groupsFor(items){
  var byTopic = state.topic === 'all';
  var keyOf = byTopic ? function(b){ return b.lane; } : whereOf;
  var order = byTopic ? ['ai_music', 'ticketing', 'ai_general', 'music_policy'] : ['OR', 'US', 'other'];
  var labelOf = byTopic ? LANE_LABEL : WHERE_LABEL;
  return order.map(function(k){
    var rows = items.filter(function(it){ return keyOf(it.b) === k; }).sort(function(x, y){ return groupSort(x.b, y.b); });
    return {label: labelOf[k], rows: rows, note: rows.some(function(it){ return datedOf(it.b); }) ? 'Dated items first' : (state.tab === 'active' ? 'Furthest along first' : 'Most recent first')};
  }).filter(function(g){ return g.rows.length; });
}
function render(){
  var list = $('list'); list.innerHTML = '';
  // counted the way the quick filters list them: filter first, then collapse companion versions
  var active = collapse(bills.filter(function(b){ return statusOf(b) === 'active'; }));
  var nReview = collapse(bills.filter(needsReview)).length;
  var nDated = collapse(bills.filter(function(b){ return statusOf(b) === 'active' && inWindow(b); })).length;
  $('nReview').textContent = nReview; $('nDated').textContent = nDated;
  $('cellReview').className = 'cell' + (state.quick === 'review' ? ' on' : '');
  $('cellDated').className = 'cell' + (state.quick === 'dated' ? ' on' : '');
  $('tracking').innerHTML = '<strong>' + active.length + ' active</strong> · ' + tabCount('enacted') + ' enacted · ' +
    collapse(bills.filter(flagged)).length + ' flagged by committee · ' + totalScanned + ' items scanned';
  drawTabs(); drawChips();

  var items = collapse(bills.filter(pass)).filter(function(it){ return matchesQuery(it.b, it.members); });
  var groups = groupsFor(items);
  groups.forEach(function(g){
    var sec = el('section', 'sec');
    sec.innerHTML = '<div class="sechead"><h2>' + esc(g.label) + '<span class="n">' + g.rows.length + '</span></h2><span class="micro">' + esc(g.note) + '</span></div>' +
      '<div class="cols"><span>Bill</span><span>What it does</span><span>Where it stands</span><span class="r">Last action</span></div>';
    g.rows.forEach(function(it){ sec.appendChild(row(it.b, it.members)); });
    list.appendChild(sec);
  });
  if (!groups.length){
    if (state.tab === 'active' && state.where === 'OR' && !state.q && !state.quick){
      // Oregon is quiet between sessions: point at where its bills actually are
      var p = el('p', 'none', 'Nothing pending in Oregon. <span>The next session opens early in the year and presession filings usually post from December; they appear here as OLIS publishes them.</span>');
      var jump = el('div', 'jump');
      [['enacted', 'Oregon laws on the books'], ['dead', 'Oregon bills that did not pass']].forEach(function(t){
        var save = state.tab; state.tab = t[0];
        var n = collapse(bills.filter(pass)).length;
        state.tab = save;
        if (n) jump.appendChild(btn(n + ' · ' + t[1], 'b', function(){ state.tab = t[0]; render(); }));
      });
      if (jump.childNodes.length) p.appendChild(jump);
      list.appendChild(p);
    }
    else list.appendChild(el('p', 'none', 'Nothing matches those filters. <span>Reset, or widen the status tab.</span>'));
  }
  if (state.tab === 'notrel' && groups.length) list.appendChild(el('p', 'official', 'Set aside by a member, hidden by a keyword rule, or off the two topics. Nothing is deleted: open a row and use Move back to active.'));

  $('foot').innerHTML = totalScanned + ' items in the database, ' + active.length + ' active on the two topics. ' +
    (lastRun ? 'Last scan ' + esc(stamp(lastRun)) + '. ' : '') +
    'Relevance is keyword rules plus committee review, no AI scoring; summaries come from the sources\' own text. Bill data from <a href="https://legiscan.com" target="_blank" rel="noopener">LegiScan</a> (CC BY 4.0), ' +
    'the <a href="https://olis.oregonlegislature.gov" target="_blank" rel="noopener">Oregon Legislature (OLIS)</a>, the ' +
    '<a href="https://www.federalregister.gov" target="_blank" rel="noopener">Federal Register</a> and <a href="https://www.congress.gov" target="_blank" rel="noopener">Congress.gov</a>. ' +
    'Private committee tool for Music Oregon, not for redistribution.';
  $('scanStamp').textContent = lastRun ? 'Scan ' + stamp(lastRun) : 'No scan recorded';
  $('whoBtn').textContent = user ? 'Signed in · ' + user : 'Sign in';
  syncUrl();
}
var totalScanned = 0;
function drawTabs(){
  var n = $('tabs'); n.innerHTML = '';
  TABS.forEach(function(t){
    var b = btn(esc(t[1]) + '<span class="n">' + tabCount(t[0]) + '</span>', 'tab' + (state.tab === t[0] ? ' on' : ''), function(){ state.tab = t[0]; state.quick = null; render(); window.scrollTo(0, 0); });
    n.appendChild(b);
  });
}
function drawChips(){
  var t = $('topicChips'); t.innerHTML = '';
  TOPIC_CHIPS.forEach(function(c){ t.appendChild(btn(esc(c[1]), 'chip' + (state.topic === c[0] ? ' on' : ''), function(){ state.topic = c[0]; render(); })); });
  var w = $('whereChips'); w.innerHTML = '';
  WHERE_CHIPS.forEach(function(c){ w.appendChild(btn(esc(c[1]), 'chip' + (state.where === c[0] ? ' on' : ''), function(){ state.where = c[0]; render(); })); });
}
function syncUrl(){
  var p = [];
  if (state.tab !== 'active') p.push('tab=' + state.tab);
  if (state.topic !== 'all') p.push('topic=' + state.topic);
  if (state.where !== 'all') p.push('where=' + state.where);
  if (state.q) p.push('q=' + encodeURIComponent(state.q));
  if (state.quick) p.push('quick=' + state.quick);
  if (state.open) p.push('bill=' + state.open);
  var url = location.pathname + (p.length ? '?' + p.join('&') : '');
  if (url !== location.pathname + location.search) history.replaceState(null, '', url);
}
function readUrl(){
  var q = new URLSearchParams(location.search);
  if (TABS.some(function(t){ return t[0] === q.get('tab'); })) state.tab = q.get('tab');
  if (TOPIC_CHIPS.some(function(t){ return t[0] === q.get('topic'); })) state.topic = q.get('topic');
  if (WHERE_CHIPS.some(function(t){ return t[0] === q.get('where'); })) state.where = q.get('where');
  if (q.get('q')) state.q = q.get('q').trim().toLowerCase();
  if (q.get('quick') === 'review' || q.get('quick') === 'dated') state.quick = q.get('quick');
  if (q.get('bill') && /^\d+$/.test(q.get('bill'))) state.open = +q.get('bill');
  $('search').value = state.q;
}

$('cellReview').onclick = function(){ state.quick = state.quick === 'review' ? null : 'review'; state.tab = 'active'; render(); };
$('cellDated').onclick = function(){ state.quick = state.quick === 'dated' ? null : 'dated'; state.tab = 'active'; render(); };
$('resetBtn').onclick = function(){ state.tab = 'active'; state.topic = 'all'; state.where = 'all'; state.q = ''; state.quick = null; $('search').value = ''; render(); };
$('search').addEventListener('input', function(e){ state.q = e.target.value.trim().toLowerCase(); render(); });

function showLogin(){ $('loginScreen').style.display = 'flex'; $('app').hidden = true; $('backBtn').style.display = publicMode ? 'inline-block' : 'none'; $('email').focus(); }
function showApp(){ $('loginScreen').style.display = 'none'; $('app').hidden = false; loadData(); }
function show(session){
  var loggedIn = !!session;
  user = loggedIn ? (session.user.email || session.user.id) : null;
  uid = loggedIn ? session.user.id : null;
  if (loggedIn){ showApp(); return; }
  // no session: if the database lets the public read bills, show a read-only tracker, else the login wall
  sb.from('leg_bills').select('id').limit(1).then(function(r){
    publicMode = !r.error && !!(r.data && r.data.length);
    if (publicMode) showApp(); else showLogin();
  });
}
$('loginBtn').onclick = function(){
  $('loginErr').style.display = 'none';
  sb.auth.signInWithPassword({email: $('email').value.trim(), password: $('pass').value})
    .then(function(r){
      if (r.error){ $('loginErr').textContent = r.error.message; $('loginErr').style.display = 'block'; }
      else show(r.data.session);
    });
};
$('pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('loginBtn').click(); });
$('email').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('pass').focus(); });
$('whoBtn').onclick = function(){ if (user) sb.auth.signOut().then(function(){ show(null); }); else showLogin(); };
$('backBtn').onclick = function(){ show(null); };

function boot(){
  readUrl();
  sb.auth.getSession().then(function(r){ show(r.data && r.data.session); });
}
boot();
</script>
