<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<meta name="description" content="A growing directory of live music venues across Oregon, with booking contacts, venue details, and information on openings and closures.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Oregon Venue Directory</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--stock:#e6e7e2;--stock-hover:#dcddd7;--ink:#141414;--flood:#f0451f;--scrim:rgba(20,20,20,.55)}
*{box-sizing:border-box}
body{margin:0;background:var(--stock);color:var(--ink);font-family:'Spline Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--flood)}
a:hover{background:var(--flood);color:var(--stock);border-bottom-color:var(--flood)}
select,input,textarea,button{font:inherit;color:inherit}
[hidden]{display:none!important}
.tnum{font-feature-settings:'tnum' 1}
.flood{color:var(--flood)}
.none{opacity:.5}
/* header bar */
.top{background:var(--ink);color:var(--stock);padding:10px 26px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px}
.wordmark{font-family:Anton,sans-serif;font-weight:400;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.product{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.nav{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.nav a,.nav button{border:0;background:none;padding:0;cursor:pointer;color:var(--stock);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.nav a:hover,.nav button:hover{color:var(--flood);background:none}
.nav .current{color:var(--flood)}
.nav .who{opacity:.55;cursor:default;text-transform:none;letter-spacing:.02em}
/* headline block */
.hero{padding:26px 26px 22px;border-bottom:3px solid var(--ink)}
.hero h1{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:clamp(30px,4.5vw,58px);line-height:.92;letter-spacing:-.01em;text-transform:uppercase;max-width:22ch;text-wrap:pretty}
.heroline{margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.lead{margin:16px 0 0;font-size:16px;line-height:1.5;max-width:52ch;text-wrap:pretty}
.lead+.lead{margin-top:12px}
/* census band */
.census{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-bottom:3px solid var(--ink)}
.cell{padding:18px 22px 16px;border-right:1px solid var(--ink)}
.cell:last-child{border-right:0}
.cell.hot{background:var(--flood);color:var(--stock)}
.cell .num{font-family:Anton,sans-serif;font-weight:400;font-size:62px;line-height:.85;font-feature-settings:'tnum' 1}
.cell .lab{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
/* body */
.body{display:flex;flex-wrap:wrap}
.rail{flex:0 1 244px;min-width:214px;border-right:3px solid var(--ink);padding:22px 20px 50px}
.rail-h{font-family:Anton,sans-serif;font-weight:400;font-size:15px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--stock);padding:4px 8px;display:inline-block}
.rail label.sel{display:block;margin-top:20px}
.rail label.sel+label.sel{margin-top:14px}
.lbl{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.rail select{width:100%;appearance:none;-webkit-appearance:none;background:var(--stock);color:var(--ink);border:2px solid var(--ink);padding:7px 9px;font-size:14px;font-weight:500;border-radius:0;cursor:pointer}
.rail select:focus{outline:none;border-color:var(--flood)}
.bands,.chips{margin-top:22px}
.bands .lbl,.chips .lbl{margin-bottom:8px}
.band-list{display:flex;flex-direction:column;gap:4px}
.band{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;color:var(--ink);border:2px solid var(--ink);padding:6px 9px;font-size:13px;font-weight:500;cursor:pointer;border-radius:0}
.band:hover{background:var(--stock-hover)}
.band.active,.band.active:hover{background:var(--ink);color:var(--stock)}
.band .n{opacity:.6;font-feature-settings:'tnum' 1}
.chip-list{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:4px 9px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0}
.chip:hover{background:var(--stock-hover)}
.chip.active,.chip.active:hover{background:var(--flood);color:var(--stock);border-color:var(--flood)}
.clear{margin-top:26px;background:none;border:0;padding:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid var(--flood);color:var(--ink)}
.clear:hover{background:var(--flood);color:var(--stock)}
.results{flex:1 1 540px;min-width:0;padding:22px 26px 70px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding-bottom:10px;border-bottom:3px solid var(--ink)}
.bar .dim{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(280px,calc(33.333% - 12px)),1fr));gap:18px;margin-top:22px;align-items:start}
.card{display:flex;flex-direction:column;gap:11px;background:var(--stock);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px 16px 14px;cursor:pointer;color:var(--ink);transition:box-shadow .12s ease}
.card:hover{box-shadow:6px 6px 0 var(--flood);background:var(--stock);color:var(--ink);border-color:var(--ink)}
.card:focus-visible,.lrow:focus-visible{outline:3px solid var(--flood);outline-offset:2px}
.ident{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card h3{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:21px;line-height:1.02;text-transform:uppercase;text-wrap:pretty}
.cap{font-family:Anton,sans-serif;font-weight:400;font-size:22px;line-height:1;color:var(--flood);font-feature-settings:'tnum' 1;white-space:nowrap}
.cap.none{font-family:'Spline Sans',system-ui,sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);opacity:.5;line-height:1.3;text-align:right;white-space:normal;max-width:72px}
.parent{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:4px}
.capwrap{text-align:right;flex:0 0 auto}
.capk{display:block;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-top:3px;white-space:nowrap}
.loc{margin-top:5px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.badge{align-self:flex-start;background:transparent;color:var(--ink);border:2px solid var(--ink);padding:3px 8px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.badge.aa{background:var(--flood);color:var(--stock);border-color:var(--flood)}
.fields{border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.fl{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin-bottom:2px}
.fv{font-size:13px;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.fv.stage{font-weight:400;text-wrap:pretty}
.empty{margin:34px 0;font-size:15px;font-weight:500}
.empty span{opacity:.55}
.sec{margin-top:44px;border-top:3px solid var(--ink);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.sec h2{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.sec .note{font-size:12px;opacity:.65;max-width:52ch;text-wrap:pretty}
.tl{margin-top:8px}
.tl-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--ink)}
.tl-when{font-family:Anton,sans-serif;font-weight:400;font-size:15px;text-transform:uppercase;color:var(--flood);font-feature-settings:'tnum' 1}
.tl-what{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.tl-what b{font-weight:600}
.tl-what .k{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-right:8px}
.src{font-size:13px;margin:6px 0 0;line-height:1.45;overflow-wrap:anywhere}
.src .k{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-left:6px}
.seedlist .lrow{grid-template-columns:minmax(0,1fr) minmax(0,150px) 110px}
.closed{margin-top:56px}
.closed-h{background:var(--ink);color:var(--stock);padding:8px 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.closed h2{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.closed .note{font-size:12px;max-width:48ch;text-wrap:pretty;opacity:.8}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px) 58px 64px;gap:6px 16px;align-items:baseline;padding:11px 0;border:0;border-bottom:1px solid var(--ink);cursor:pointer;color:var(--ink);transition:background-color .12s ease}
.lrow:hover{background:var(--stock-hover);color:var(--ink);border-bottom-color:var(--ink)}
.ln{font-family:Anton,sans-serif;font-weight:400;font-size:18px;text-transform:uppercase;min-width:0;opacity:.8}
.lc{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.55;min-width:0}
.lcap{font-size:12.5px;font-weight:500;text-align:right;opacity:.55;font-feature-settings:'tnum' 1}
.ly{font-family:Anton,sans-serif;font-weight:400;font-size:17px;color:var(--flood);text-align:right;font-feature-settings:'tnum' 1}
.ledger .empty{margin:18px 0 0;font-size:14px}
.foot{border-top:3px solid var(--ink);padding:16px 26px 44px;font-size:12px;line-height:1.6;color:rgba(20,20,20,.6)}
.foot button{background:none;border:0;border-bottom:2px solid var(--flood);padding:0;cursor:pointer;font-size:12px;color:var(--ink)}
.foot button:hover{background:var(--flood);color:var(--stock)}
/* detail sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;overflow:auto;z-index:40}
.sheet{background:var(--stock);border:3px solid var(--ink);box-shadow:12px 12px 0 var(--flood);max-width:660px;width:100%;padding:26px 26px 30px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.sheet-head>div{min-width:0}
.eyebrow{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;background:var(--ink);color:var(--stock)}
.eyebrow.hot{background:var(--flood)}
.sheet h2{margin:10px 0 0;font-family:Anton,sans-serif;font-weight:400;font-size:clamp(30px,5vw,46px);line-height:.94;text-transform:uppercase;text-wrap:pretty;overflow-wrap:anywhere}
.meta{margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.x{background:none;border:2px solid var(--ink);width:34px;height:34px;font-size:16px;line-height:1;cursor:pointer;flex:0 0 auto;padding:0;color:var(--ink);border-radius:0}
.x:hover{background:var(--ink);color:var(--stock)}
.dl{margin:22px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 24px;border-top:3px solid var(--ink);padding-top:18px}
.dl dt{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin-bottom:4px}
.dl dd{margin:0;font-size:14px;line-height:1.4;font-weight:500;text-wrap:pretty;overflow-wrap:anywhere}
.sec-h{margin:22px 0 0;font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(20,20,20,.5);border-top:2px solid var(--ink);padding-top:12px}
.hist{font-size:13px;margin:8px 0 0;line-height:1.45}
.hist b{font-weight:600}
.sheet-foot{margin:22px 0 0;font-size:12px;border-top:2px solid var(--ink);padding-top:12px;color:rgba(20,20,20,.6);line-height:1.5}
.prose{margin-top:22px;border-top:3px solid var(--ink);padding-top:18px;font-size:14px;line-height:1.5}
.prose p{margin:0 0 12px;text-wrap:pretty}
.prose b{font-weight:600}
/* editor controls: ink only, flood stays rationed */
.tools{margin-top:22px;border-top:3px solid var(--ink);padding-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .tl{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin-right:6px}
.btn{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;border-radius:0}
.btn:hover{background:var(--ink);color:var(--stock)}
.btn-ink{background:var(--ink);color:var(--stock)}
.btn-ink:hover{opacity:.85}
.btn-quiet{opacity:.6}
.btn-text{border:0;background:none;padding:0;color:var(--ink);border-bottom:2px solid var(--flood);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn-text:hover{background:var(--flood);color:var(--stock)}
.form{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;border-top:3px solid var(--ink);padding-top:16px}
.form .wide{grid-column:1 / -1}
.form label>span,.inline label>span,.login label>span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin-bottom:4px}
.form input,.form select,.inline input,.inline select,.login input{width:100%;background:var(--stock);color:var(--ink);border:2px solid var(--ink);padding:7px 9px;font-size:14px;font-weight:500;border-radius:0}
.form select,.inline select{appearance:none;-webkit-appearance:none;cursor:pointer}
.form textarea,.notebox{width:100%;background:var(--stock);color:var(--ink);border:2px solid var(--ink);padding:8px 9px;font-size:14px;line-height:1.45;min-height:64px;border-radius:0;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,.inline input:focus,.inline select:focus,.login input:focus,.notebox:focus{outline:none;border-color:var(--flood)}
.inline{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin-top:14px}
.inline label{flex:1 1 140px}
.inline .grow{flex:2 1 220px}
.inline .check{flex:1 1 100%;font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center}
.inline .check input{width:auto}
.mynote{font-size:13px;background:var(--stock-hover);border-left:3px solid var(--ink);padding:8px 10px;margin:8px 0 0;white-space:pre-wrap;line-height:1.45}
.mynote b{opacity:.6;font-weight:600;margin-right:6px}
.err{font-size:12px;font-weight:600;border-left:3px solid var(--flood);padding-left:8px;margin-top:12px}
.login{margin-top:22px;display:flex;flex-direction:column;gap:14px;border-top:3px solid var(--ink);padding-top:18px}
@media (max-width:640px){
  .top,.hero,.results,.foot{padding-left:18px;padding-right:18px}
  .rail{flex:1 1 100%;padding:20px 18px 36px;border-right:0;border-bottom:3px solid var(--ink)}
  .nav{gap:12px}
  .cell{padding:14px 16px 12px}
  .cell .num{font-size:48px}
  .lrow,.seedlist .lrow{grid-template-columns:minmax(0,1fr) auto;gap:3px 14px}
  .tl-row{grid-template-columns:1fr}
  .ln{grid-column:1;grid-row:1}.ly{grid-column:2;grid-row:1}.lc{grid-column:1;grid-row:2}.lcap{grid-column:2;grid-row:2}
  .form{grid-template-columns:1fr}
  .sheet{padding:20px 16px 24px;box-shadow:8px 8px 0 var(--flood)}
  .scrim{padding:3vh 14px 3vh 10px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="wordmark">Oregon Sound Circuit</span><span class="product">Venue Directory</span></div>
  <nav class="nav" id="nav" aria-label="Site"></nav>
</header>

<section class="hero">
  <h1><span class="flood">Oregon&rsquo;s</span> Live Music Venue Directory</h1>
  <p class="lead">A growing directory of live music venues across Oregon, with booking contacts, venue details, and information on openings and closures.</p>
  <div class="heroline" id="heroline"></div>
</section>

<section class="census" id="figures" aria-label="Counts"></section>

<div class="body">
  <aside class="rail" id="rail" aria-label="Filters"></aside>
  <main class="results" id="results"></main>
</div>

<footer class="foot" id="foot"></footer>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// Publishable key only. Anyone can read published venues (row level security);
// editors sign in with Supabase Auth to add, edit and verify. Editor-only columns
// are hidden from the public by column grants, so the public read must name
// exactly the granted columns.
var SB_URL = 'https://ybfaykwwnirjwabmgsqu.supabase.co';
var SB_KEY = 'sb_publishable__doHKn0KYVVPUnYqVdchnw_TBUq5eYy';
var sb = window.supabase.createClient(SB_URL, SB_KEY);
var $ = function(id){ return document.getElementById(id); };

var PUBLIC_COLS = ['id','slug','name','aka','kind','status','status_since','opened_year','closed_on','address','city','state','zip',
  'county','neighborhood','lat','lng','capacity','capacity_note','ages','ownership','owner_operator','website','booking_url',
  'booking_email','booking_note','instagram','phone','genres','pay_model','sound_note','notes','sources','osm_id','published',
  'last_verified_on','created_at','updated_at',
  'venue_id','region','parent_venue','room_name','capacity_seated','capacity_standing','capacity_type','status_date_precision',
  'closure_type','successor_venue','researched_on'];
var EDITOR_COLS = PUBLIC_COLS.concat(['liquor_license','extra','verified_by','created_by','updated_by',
  'status_confidence','capacity_confidence','ages_confidence','inclusion_basis','source_origin']);
var PUBLIC_EVENT_COLS = ['id','venue_id','occurred_on','kind','detail','source_url','created_at','date_precision','capacity_at_event','source_title'];
var EDITOR_EVENT_COLS = PUBLIC_EVENT_COLS.concat(['created_by','confidence']);
var PUBLIC_EVIDENCE_COLS = ['id','venue_id','field_name','asserted_value','source_url','source_title','publisher','source_type','publication_date','accessed_on','note'];
var EDITOR_EVIDENCE_COLS = PUBLIC_EVIDENCE_COLS.concat(['confidence']);

var KINDS = {music_venue:'Music venue', bar_club:'Bar or club', theater:'Theater or hall', arena_amphitheater:'Arena or amphitheater',
  event_space:'Event space', arts_center:'Arts center', diy_allages:'DIY or all-ages space', brewery_restaurant:'Brewery or restaurant',
  community_hall:'Community hall', outdoor:'Outdoor', other:'Other', unknown:'Unclassified'};
var STATUS = {open:'Open', seasonal:'Seasonal', temporarily_closed:'Temporarily closed', planned:'Planned', opening_soon:'Planned',
  for_sale:'For sale', closed:'Closed', ceased_live_music:'Ceased live music', unknown:'Unverified'};
var CURRENT = ['open', 'seasonal'];
var PLANNED = ['planned', 'opening_soon'];
var GONE = ['closed', 'ceased_live_music'];
var AGES = {all_ages:'All ages', '21_plus':'21+', '18_plus':'18+', minors_with_adult:'Minors with an adult', mixed:'Varies by event', unknown:'Ages not verified'};
var OWNERSHIP = {independent:'Independent', corporate:'Corporate or chain', nonprofit:'Nonprofit', public:'Public', unknown:'Not recorded'};
var CAP_TYPE = {advertised_audience:'advertised', reported_estimate:'reported', unknown:''};
var PRECISION = {day:'Exact date', month:'Month known', year:'Year known', unknown:'Unknown'};
var REGIONS = ['Portland Metro','Willamette Valley','Central Oregon','North Coast','Central Coast','South Coast','Rogue Valley',
  'Umpqua Valley','Klamath Basin','Columbia Gorge','Eastern Oregon','Southwest Washington'];
var EVENT_KINDS = {opened:'Opened', closed:'Closed', reopened:'Reopened', temporarily_closed:'Temporarily closed',
  ceased_live_music:'Ceased live music', planned_opening:'Planned opening', changed_hands:'Changed hands',
  renamed:'Renamed', capacity_changed:'Capacity changed', moved:'Relocated', for_sale:'Put up for sale', other:'Other'};
// adding one of these events also sets the venue's status
var EVENT_SETS_STATUS = {opened:'open', reopened:'open', closed:'closed', ceased_live_music:'ceased_live_music',
  temporarily_closed:'temporarily_closed', planned_opening:'planned', for_sale:'for_sale'};
var CONF = {verified:'verified', corroborated:'corroborated', provisional:'provisional', conflicting:'conflicting', unknown:'unknown'};
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var BANDS = [
  {key:'any', label:'Any capacity', test:function(){ return true; }},
  {key:'s', label:'Under 100', test:function(v){ return capMax(v) != null && capMax(v) < 100; }},
  {key:'m', label:'100 – 299', test:function(v){ return capMax(v) != null && capMax(v) >= 100 && capMax(v) < 300; }},
  {key:'l', label:'300 – 999', test:function(v){ return capMax(v) != null && capMax(v) >= 300 && capMax(v) < 1000; }},
  {key:'xl', label:'1,000 and up', test:function(v){ return capMax(v) != null && capMax(v) >= 1000; }},
  {key:'none', label:'Capacity unknown', test:function(v){ return capMax(v) == null; }}
];

// ------------------------------------------------------------------ state
var user = null, venues = [], events = {}, evidence = {}, notes = {};
var f = {region:'', city:'', kind:'', band:'any', age:'any', booking:false};   // the rail, mirrored in the query string
var view = 'register';                                // register | drafts (editors)

var eventForm = false, lastFocus = null, showSeed = false, showAllSources = false, showEarlier = false;
var BASE = '/venues';

function localDay(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
var TODAY = localDay(new Date());
function fmt(d){
  if (!d) return '';
  d = String(d).slice(0, 10);
  var p = d.split('-'), y = +p[0], m = +p[1], day = +p[2];
  if (!y || !m || !day) return d;
  return MONTHS[m - 1] + ' ' + day + ', ' + y;
}
// dates carry a precision: a closure known only to the year prints as the year
function fmtP(d, prec){
  if (!d) return '';
  d = String(d).slice(0, 10);
  if (prec === 'year') return d.slice(0, 4);
  if (prec === 'month') return MONTHS[+d.slice(5, 7) - 1] + ' ' + d.slice(0, 4);
  return fmt(d);
}
function yearOf(d){ return d ? +String(d).slice(0, 4) : null; }
function num(n){ return n == null ? '' : Number(n).toLocaleString('en-US'); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function link(url, label){
  if (!url) return '';
  var href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
  return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(label || domain(url)) + '</a>';
}
function domain(url){ return String(url).replace(/^https?:\/\/(www\.)?/, '').replace(/\/.*$/, ''); }
function slugify(s){ return String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80) || 'venue'; }
function editable(){ return !!user; }
function kindL(v){ return KINDS[v.kind] || KINDS.unknown; }
function statusL(v){ return STATUS[v.status] || STATUS.unknown; }
function agesL(v){ return AGES[v.ages] || AGES.unknown; }
function byId(id){ return venues.filter(function(v){ return v.id === id; })[0]; }
function bySlug(s){ return venues.filter(function(v){ return v.slug === s; })[0]; }
function capMax(v){ return v.capacity != null ? v.capacity : (v.capacity_standing != null ? v.capacity_standing : v.capacity_seated); }
function hasBooking(v){ return !!(v.booking_email || v.booking_url); }

// ------------------------------------------------------------------ sets
function isCurrent(v){ return v.published && CURRENT.indexOf(v.status) >= 0; }
function isTemp(v){ return v.published && v.status === 'temporarily_closed'; }
function isPlanned(v){ return v.published && PLANNED.indexOf(v.status) >= 0; }
function isGone(v){ return v.published && GONE.indexOf(v.status) >= 0; }
function isDraft(v){ return !v.published; }
function isResearched(v){ return !!v.venue_id; }
function matches(v){
  if (f.region && (v.region || '') !== f.region) return false;
  if (f.city && (v.city || '') !== f.city) return false;
  if (f.kind && v.kind !== f.kind) return false;
  var band = BANDS.filter(function(b){ return b.key === f.band; })[0] || BANDS[0];
  if (!band.test(v)) return false;
  if (f.age === 'all_ages' && v.ages !== 'all_ages') return false;
  if (f.age === '21_plus' && v.ages !== '21_plus') return false;
  if (f.booking && !hasBooking(v)) return false;
  return true;
}
function filtered(){ return !!(f.region || f.city || f.kind || f.band !== 'any' || f.age !== 'any' || f.booking); }
function byCap(a, b){
  var ca = capMax(a), cb = capMax(b);
  if (ca == null && cb == null) return a.name.localeCompare(b.name);
  if (ca == null) return 1;
  if (cb == null) return -1;
  return cb - ca || a.name.localeCompare(b.name);
}
function byClosure(a, b){
  if (!a.closed_on && !b.closed_on) return a.name.localeCompare(b.name);
  if (!a.closed_on) return 1;
  if (!b.closed_on) return -1;
  return String(b.closed_on).localeCompare(String(a.closed_on)) || a.name.localeCompare(b.name);
}

// ------------------------------------------------------------------ url
function readUrl(){
  var q = new URLSearchParams(location.search);
  f.region = REGIONS.indexOf(q.get('region')) >= 0 ? q.get('region') : '';
  f.city = q.get('city') || '';
  f.kind = q.get('kind') || '';
  f.band = BANDS.some(function(b){ return b.key === q.get('cap'); }) ? q.get('cap') : 'any';
  f.age = AGE_CHIPS.some(function(a){ return a.key === q.get('ages'); }) ? q.get('ages') : 'any';
  f.booking = q.get('booking') === '1';
  var m = location.pathname.match(/^\/venues\/([^\/]+)\/?$/);
  var slug = m && m[1] !== 'index.html' ? decodeURIComponent(m[1]) : (location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : '');
  var hit = slug ? bySlug(slug) : null;
  if (hit){ sheet = {mode:'detail', id: hit.id}; if (!hit.published) view = 'drafts'; }
  else if (sheet && sheet.mode === 'detail') sheet = null;
}
function urlFor(slug){
  var q = new URLSearchParams();
  if (f.region) q.set('region', f.region);
  if (f.city) q.set('city', f.city);
  if (f.kind) q.set('kind', f.kind);
  if (f.band !== 'any') q.set('cap', f.band);
  if (f.age !== 'any') q.set('ages', f.age);
  if (f.booking) q.set('booking', '1');
  var s = q.toString();
  return BASE + (slug ? '/' + encodeURIComponent(slug) : '') + (s ? '?' + s : '');
}
function syncUrl(){
  var v = sheet && sheet.mode === 'detail' ? byId(sheet.id) : null;
  var target = urlFor(v ? v.slug : '');
  if (location.pathname + location.search !== target) history.replaceState(history.state, '', target);
}

// ------------------------------------------------------------------ data
async function fetchAll(table, cols, mod){
  var out = [], from = 0, size = 1000;
  while (true){
    var qb = sb.from(table).select(cols.join(',')).order('id').range(from, from + size - 1);
    if (mod) qb = mod(qb);
    var res = await qb;
    if (res.error) throw res.error;
    out = out.concat(res.data || []);
    if ((res.data || []).length < size) return out;
    from += size;
  }
}
async function load(){
  $('results').innerHTML = '<p class="empty">Loading the directory...</p>';
  try {
    venues = await fetchAll('venues', editable() ? EDITOR_COLS : PUBLIC_COLS, editable() ? null : function(qb){ return qb.eq('published', true); });
    var evs = await fetchAll('venue_events', editable() ? EDITOR_EVENT_COLS : PUBLIC_EVENT_COLS);
    events = {};
    evs.forEach(function(e){ (events[e.venue_id] = events[e.venue_id] || []).push(e); });
    Object.keys(events).forEach(function(k){ events[k].sort(function(a, b){ return String(b.occurred_on || '').localeCompare(String(a.occurred_on || '')) || b.id - a.id; }); });
    evidence = {};
    (await fetchAll('venue_evidence', editable() ? EDITOR_EVIDENCE_COLS : PUBLIC_EVIDENCE_COLS)).forEach(function(x){ (evidence[x.venue_id] = evidence[x.venue_id] || []).push(x); });
    notes = {};
    if (editable()){
      (await fetchAll('venue_notes', ['id','venue_id','note','created_at','created_by'])).forEach(function(n){ (notes[n.venue_id] = notes[n.venue_id] || []).push(n); });
    }
  } catch (e){
    $('results').innerHTML = '<p class="empty">Could not load the directory: ' + esc(e.message || e) + '</p>';
    return;
  }
  venues.sort(function(a, b){ return a.name.localeCompare(b.name); });
  readUrl();
  render();
}

// ------------------------------------------------------------------ render
function render(){ renderNav(); renderHeroLine(); renderFigures(); renderRail(); renderResults(); renderFoot(); renderSheet(); syncUrl(); }
function navItem(action, label, cls){ return '<button data-nav="' + action + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + label + '</button>'; }
function renderNav(){
  var queue = venues.filter(function(v){ return isDraft(v) && isResearched(v); }).length;
  var h = navItem('register', 'Directory', view === 'register' ? 'current' : '') + navItem('closures', 'Openings &amp; closures');
  if (editable()) h += navItem('drafts', 'Research queue <span class="tnum">' + queue + '</span>', view === 'drafts' ? 'current' : '');
  h += navItem('method', 'Methodology');
  if (editable()) h += navItem('add', 'Add a venue');
  h += editable() ? '<span class="who" title="' + esc(user.email) + '">' + esc(user.email.split('@')[0]) + '</span>' + navItem('signout', 'Sign out') : navItem('login', 'Editor sign in');
  $('nav').innerHTML = h;
}
function renderHeroLine(){
  var pub = venues.filter(function(v){ return v.published; });
  var latest = pub.reduce(function(m, v){ return v.researched_on && v.researched_on > m ? v.researched_on : m; }, '');
  var sourced = pub.filter(function(v){ return (evidence[v.id] || []).length || v.sources; }).length;
  var verified = pub.filter(function(v){ return v.last_verified_on; }).length;
  var parts = [];
  if (latest) parts.push('Researched through ' + fmt(latest));
  if (sourced) parts.push(num(sourced) + ' rooms with cited sources');
  parts.push(verified ? num(verified) + ' verified by an editor' : 'Editor verification in progress');
  $('heroline').innerHTML = parts.join(' · ');
}
function renderFigures(){
  var current = venues.filter(isCurrent), gone = venues.filter(isGone), planned = venues.filter(isPlanned);
  var withCap = current.filter(function(v){ return capMax(v) != null; }).length;
  var figs = [[num(current.length), 'Current venue rooms', ''], [num(gone.length), 'Closed or ceased music', ' hot'],
    [num(withCap), 'With a recorded capacity', ''], [num(planned.length), 'Planned', '']];
  $('figures').innerHTML = figs.map(function(x){ return '<div class="cell' + x[2] + '"><div class="num">' + x[0] + '</div><div class="lab">' + x[1] + '</div></div>'; }).join('');
}
function renderRail(){

    cityOpts.map(function(c){ return '<option value="' + esc(c) + '"' + (c === f.city ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label>';
  h += '<label class="sel"><span class="lbl">Room type</span><select id="kindSel"><option value="">All room types</option>' +
    kindOpts.map(function(k){ return '<option value="' + k + '"' + (k === f.kind ? ' selected' : '') + '>' + KINDS[k] + '</option>'; }).join('') + '</select></label>';
  h += '<div class="bands"><span class="lbl">Capacity</span><div class="band-list">' + BANDS.map(function(b){
    return '<button class="band' + (b.key === f.band ? ' active' : '') + '" data-band="' + b.key + '"><span>' + b.label + '</span><span class="n">' + num(pool.filter(b.test).length) + '</span></button>';
  }).join('') + '</div></div>';
  h += '<div class="chips"><span class="lbl">Ages</span><div class="chip-list">' + AGE_CHIPS.map(function(a){
    return '<button class="chip' + (a.key === f.age ? ' active' : '') + '" data-age="' + a.key + '">' + a.label + '</button>';
  }).join('') + '</div></div>';
  h += '<div class="chips"><span class="lbl">Booking</span><div class="chip-list"><button class="chip' + (f.booking ? ' active' : '') + '" data-booking="1">Has a booking contact</button></div></div>';
  h += '<button class="clear" data-clear="1">Clear filters</button>';

}
function capShort(v){   // the card numeral: the biggest figure, with what kind of figure it is
  var n = capMax(v);
  if (n == null) return '';
  var k = v.capacity != null ? (v.capacity_standing === v.capacity ? 'standing' : (v.capacity_seated === v.capacity ? 'seated' : 'max')) :
    (v.capacity_standing != null ? 'standing' : 'seated');
  var t = CAP_TYPE[v.capacity_type] || '';
  return '<div class="capwrap"><span class="cap">' + num(n) + '</span><span class="capk">' + k + (t ? ' · ' + t : '') + '</span></div>';
}
function capFull(v){   // the sheet: every configuration known
  var parts = [];
  if (v.capacity_standing != null) parts.push(num(v.capacity_standing) + ' standing');
  if (v.capacity_seated != null) parts.push(num(v.capacity_seated) + ' seated');
  if (!parts.length && v.capacity != null) parts.push(num(v.capacity) + ' maximum');
  else if (v.capacity != null && v.capacity !== v.capacity_standing && v.capacity !== v.capacity_seated) parts.unshift('up to ' + num(v.capacity));
  if (!parts.length) return '<span class="none">Not yet verified</span>';
  var t = CAP_TYPE[v.capacity_type] || '';
  return esc(parts.join(' / ')) + (t ? ' <span class="none">(' + t + ' figure)</span>' : '') + (v.capacity_note ? '<br><span class="none">' + esc(v.capacity_note) + '</span>' : '');
}
function locLine(v){
  var parts = [esc(v.city || (v.state !== 'OR' ? v.state : 'Oregon')), kindL(v)];
  if (v.status !== 'open' && v.status !== 'unknown') parts.push('<span class="flag">' + statusL(v).toLowerCase() + '</span>');
  if (!v.published) parts.push('<span class="flag">' + (isResearched(v) ? 'research queue' : 'seed row') + '</span>');
  return parts.join(' · ');
}
function bookingHtml(v){   // sheet: real links
  var parts = [];
  if (v.booking_email) parts.push('<a href="mailto:' + esc(v.booking_email) + '">' + esc(v.booking_email) + '</a>');
  if (v.booking_url) parts.push(link(v.booking_url, 'Booking page'));
  if (!parts.length) return '<span class="none">No booking contact listed</span>';
  return parts.join(' · ') + (v.booking_note ? '<br><span class="none">' + esc(v.booking_note) + '</span>' : '');
}
function bookingText(v){   // card: the card itself is a link, so no anchors inside it
  if (v.booking_email) return esc(v.booking_email);
  if (v.booking_url) return esc(domain(v.booking_url)) + ' <span class="none">(booking page)</span>';
  return '';
}
function card(v){
  var fields = '';
  if (hasBooking(v)) fields += '<div><div class="fl">Booking</div><div class="fv">' + bookingText(v) + '</div></div>';
  if (v.sound_note) fields += '<div><div class="fl">Stage &amp; backline</div><div class="fv stage">' + esc(v.sound_note) + '</div></div>';

    (v.ages && v.ages !== 'unknown' ? '<span class="badge' + (v.ages === 'all_ages' ? ' aa' : '') + '">' + agesL(v) + '</span>' : '') +
    (fields ? '<div class="fields">' + fields + '</div>' : '') + '</a>';
}
function ledgerRow(v){
  var y = v.closed_on ? fmtP(v.closed_on, v.status_date_precision === 'day' ? 'year' : v.status_date_precision) : '';
  return '<a class="lrow" href="' + urlFor(v.slug) + '" data-open="' + v.id + '"><span class="ln">' + esc(v.name) + '</span>' +
    '<span class="lc">' + esc(v.city || '') + (v.status === 'ceased_live_music' ? ' · ceased live music' : '') + '</span>' +
    '<span class="lcap">' + (capMax(v) != null ? num(capMax(v)) : '') + '</span>' +
    '<span class="ly">' + esc(y) + '</span></a>';
}
function seedRow(v){
  return '<a class="lrow" href="' + urlFor(v.slug) + '" data-open="' + v.id + '"><span class="ln">' + esc(v.name) + '</span>' +
    '<span class="lc">' + esc(v.city || '') + '</span><span class="lcap">' + kindL(v) + '</span></a>';
}
function section(title, note, id){
  return '<div class="sec"' + (id ? ' id="' + id + '"' : '') + '><h2>' + title + '</h2>' + (note ? '<div class="note">' + note + '</div>' : '') + '</div>';
}
function timelineRows(){
  var rows = [];
  Object.keys(events).forEach(function(k){
    var v = byId(+k);
    if (!v || !v.published) return;
    events[k].forEach(function(e){ if (e.occurred_on) rows.push({e: e, v: v}); });
  });
  rows.sort(function(a, b){ return String(b.e.occurred_on).localeCompare(String(a.e.occurred_on)) || a.v.name.localeCompare(b.v.name); });
  return rows;
}
function timelineRow(r){
  var e = r.e, v = r.v;
  return '<div class="tl-row"><span class="tl-when">' + esc(fmtP(e.occurred_on, e.date_precision)) + '</span>' +
    '<span class="tl-what"><span class="k">' + (EVENT_KINDS[e.kind] || EVENT_KINDS.other) + '</span><b><a href="' + urlFor(v.slug) + '" data-open="' + v.id + '">' + esc(v.name) + '</a></b>' +
    (v.city ? ' <span class="none">' + esc(v.city) + '</span>' : '') + (e.detail ? '<br>' + esc(e.detail.length > 160 ? e.detail.slice(0, 157) + '...' : e.detail) : '') +
    (e.source_url ? ' ' + link(e.source_url, 'source') : '') + '</span></div>';
}
function renderResults(){
  var h = '';
  if (view === 'drafts'){
    var queue = venues.filter(function(v){ return isDraft(v) && isResearched(v); }).filter(matches).sort(byCap);
    var seed = venues.filter(function(v){ return isDraft(v) && !isResearched(v); }).sort(function(a, b){ return a.name.localeCompare(b.name); });
    h += '<div class="bar"><span>' + num(queue.length) + ' in the research queue<span class="dim"> · not public</span></span><span class="dim">Capacity ↓</span></div>';
    h += queue.length ? '<div class="grid">' + queue.map(card).join('') + '</div>' : '<p class="empty">Nothing waiting' + (filtered() ? ' under these filters.' : '.') + '</p>';
    if (seed.length){
      h += section('Seed rows not in the research set', num(seed.length) + ' rooms from the OpenStreetMap seed that the research did not cover. Discard or publish from each listing.');
      h += showSeed ? '<div class="ledger seedlist">' + seed.map(seedRow).join('') + '</div>' : '<p class="empty"><button class="btn-text" data-toggle="seed">Show the ' + num(seed.length) + ' seed rows</button></p>';
    }
    $('results').innerHTML = h;
    return;
  }
  var shown = venues.filter(isCurrent).filter(matches).sort(byCap);
  h += '<div class="bar"><span>' + num(shown.length) + ' current venue rooms<span class="dim">' + (filtered() ? ' · filtered' : ' · whole state') + '</span></span><span class="dim">Capacity ↓</span></div>';
  h += shown.length ? '<div class="grid">' + shown.map(card).join('') + '</div>' : '<p class="empty">No current rooms match those filters. <span>Try widening capacity.</span></p>';
  var temp = venues.filter(isTemp).filter(matches).sort(byCap);
  if (temp.length) h += section('Temporarily closed', 'Not counted as current, not yet a loss.') + '<div class="grid">' + temp.map(card).join('') + '</div>';
  var planned = venues.filter(isPlanned).filter(matches).sort(byCap);
  if (planned.length) h += section('Planned', 'Announced or under construction. Future capacity, not current.') + '<div class="grid">' + planned.map(card).join('') + '</div>';
  var gone = venues.filter(isGone).sort(byClosure);
  h += '<section class="closed" id="closed"><div class="closed-h"><h2>Openings &amp; closures</h2><div class="note">Rooms that have shut or stopped presenting live music since 2019. Kept in the directory because the loss is the record.</div></div><div class="ledger">' +
    (gone.length ? gone.map(ledgerRow).join('') : '<p class="empty">No closures recorded yet.</p>') + '</div>';

function field(fd, v){

  else if (fd.t === 'textarea') h += '<textarea id="' + id + '">' + esc(val) + '</textarea>';
  else h += '<input id="' + id + '" type="' + (fd.t || 'text') + '"' + (fd.step ? ' step="' + fd.step + '"' : '') + ' value="' + esc(val) + '">';

}

    '<button class="btn-text" data-act="cancel">Cancel</button><span class="err" id="formErr" style="margin:0;display:none"></span></div>';

function readForm(){

    var el = $('f_' + fd.k); if (!el) return;
    var val = el.value.trim();
    if (fd.req && !val) bad = fd.l + ' is required';
    if (fd.t === 'number'){ var n = val === '' ? null : Number(val); out[fd.k] = (n === 0 && /capacity/.test(fd.k)) ? null : n; }
    else out[fd.k] = val === '' ? null : val;
  });
  if (out.state) out.state = out.state.toUpperCase().slice(0, 2);

function methodHtml(){
  return '<div class="sheet-head"><div><span class="eyebrow">Methodology</span><h2 id="sheetTitle">How the directory is kept</h2></div>' +
    '<button class="x" data-close="1" aria-label="Close">×</button></div><div class="prose">' +
    '<p><b>What counts.</b> Rooms in Oregon and the Portland area, including Southwest Washington, that present live music: dedicated venues, bars and clubs with stages, theaters and halls, arenas and amphitheaters, DIY and all-ages spaces, breweries and restaurants with a recurring music program, and civic and outdoor stages with a season. A facility with several independently booked rooms is listed once per room, and room capacities are never added together.</p>' +
    '<p><b>Where listings come from.</b> A research pass completed on September 17, 2026 compiled each room from official venue websites and calendars, technical documents, local news, the Independent Venue Coalition list, Business Oregon’s ARPA live-event award records and OpenStreetMap, with a citation for each material claim. Every listing carries its sources. Editors then verify rooms one at a time against the venue itself.</p>' +
    '<p><b>Researched is not verified.</b> “Researched” means the facts were compiled from the cited sources on the date shown. “Verified” means an editor confirmed the listing. Until a room is verified, treat capacity, ages and contacts as reported, not confirmed.</p>' +
    '<p><b>Status.</b> Current rooms are <b>open</b> or <b>seasonal</b>. <b>Temporarily closed</b> rooms are shown separately and not counted as current. <b>Planned</b> rooms are announced or under construction and count as future capacity only. <b>Closed</b> means the room or business ended operations. <b>Ceased live music</b> means the business may remain open but no longer presents a recurring music program. A room with an unknown status is never published.</p>' +
    '<p><b>Capacity.</b> Figures are shown as seated, standing or maximum, with whether the number was advertised by the venue or reported elsewhere. A blank capacity is unknown, never zero. Where sources disagree, the listing says so.</p>' +
    '<p><b>Ages.</b> All ages, 21+, 18+, minors with an adult, or varies by event. “Varies by event” does not count toward the all-ages figure.</p>' +
    '<p><b>The numbers.</b> Current venue rooms counts published rooms that are open or seasonal. Closed or ceased music counts rooms that shut or stopped presenting music since 2019. With a recorded capacity counts current rooms with any capacity figure. Planned counts announced rooms.</p>' +
    '<p><b>Who can change it.</b> Only editors. They sign in to add a room, fix a listing, record a closure or verify a listing. Nothing on this page can be edited by the public.</p>' +
    '<p><button class="btn" data-nav="csv">Download the current rooms as CSV</button></p></div>';
}
function renderSheet(){
  var scrim = $('scrim'), box = $('sheet');
  if (!sheet){ if (!scrim.hidden){ scrim.hidden = true; document.body.style.overflow = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); } return; }
  var v = sheet.id != null ? byId(sheet.id) : null;
  if ((sheet.mode === 'detail' || sheet.mode === 'edit') && !v){ sheet = null; renderSheet(); return; }
  var h = sheet.mode === 'detail' ? detailHtml(v) : sheet.mode === 'edit' ? formHtml(v) : sheet.mode === 'add' ? formHtml(null) :
    sheet.mode === 'login' ? loginHtml(sheet.note) : methodHtml();
  var wasHidden = scrim.hidden;
  box.innerHTML = h;
  if (wasHidden){ lastFocus = document.activeElement; scrim.hidden = false; document.body.style.overflow = 'hidden'; scrim.scrollTop = 0; }
  if (wasHidden || sheet.mode === 'login'){ var first = box.querySelector(sheet.mode === 'login' ? '#email' : '.x'); if (first) first.focus(); }
}
function openSheet(s){ sheet = s; eventForm = false; showAllSources = false; render(); }
function closeSheet(){ sheet = null; eventForm = false; render(); }
function downloadCsv(){
  var rows = venues.filter(isCurrent).sort(byCap);
  var cols = PUBLIC_COLS.filter(function(c){ return ['id','osm_id','published','created_at','updated_at','status_date_precision'].indexOf(c) < 0; });
  var lines = [cols.join(',')].concat(rows.map(function(v){ return cols.map(function(c){ var s = v[c] == null ? '' : String(v[c]); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(','); }));
  var blob = new Blob([lines.join('\n')], {type: 'text/csv'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'oregon-venue-directory-' + TODAY + '.csv'; a.click();
}

// ------------------------------------------------------------------ writes (editors)
function stamp(obj){ obj.updated_at = new Date().toISOString(); obj.updated_by = user.email; return obj; }
function replaceLocal(row){ venues = venues.map(function(v){ return v.id === row.id ? row : v; }); }
async function updateVenue(id, patch){
  var res = await sb.from('venues').update(stamp(patch)).eq('id', id).select(EDITOR_COLS.join(',')).single();
  if (res.error) throw res.error;
  replaceLocal(res.data);
  return res.data;
}
async function insertVenue(obj){
  obj.created_by = user.email; obj.published = true;
  var base = slugify(obj.name + ' ' + (obj.city || ''));
  for (var n = 0; n < 6; n++){
    obj.slug = n ? base + '-' + (n + 1) : base;
    var res = await sb.from('venues').insert(stamp(obj)).select(EDITOR_COLS.join(',')).single();
    if (!res.error){ venues.push(res.data); venues.sort(function(a, b){ return a.name.localeCompare(b.name); }); return res.data; }
    if (res.error.code !== '23505') throw res.error;
  }
  throw new Error('could not find a free slug');
}
async function act(a, id){
  var v = id != null ? byId(id) : null;
  try {
    if (a === 'verify'){
      var patch = {last_verified_on: TODAY, verified_by: user.email};
      if (v.status === 'unknown'){ patch.status = 'open'; patch.status_since = TODAY; patch.status_date_precision = 'day'; }
      await updateVenue(id, patch);
    } else if (a === 'edit'){ sheet = {mode:'edit', id: id}; eventForm = false;
    } else if (a === 'cancel'){ sheet = sheet && sheet.mode === 'edit' ? {mode:'detail', id: sheet.id} : null;
    } else if (a === 'save'){
      var data = readForm();
      if (data.error){ var er = $('formErr'); er.textContent = data.error; er.style.display = ''; return; }
      if (id){ await updateVenue(id, data); sheet = {mode:'detail', id: id}; }
      else { var made = await insertVenue(data); sheet = {mode:'detail', id: made.id}; view = 'register'; }
    } else if (a === 'event'){ eventForm = true;
    } else if (a === 'cancelEvent'){ eventForm = false;
    } else if (a === 'saveEvent'){
      var kind = $('evKind').value, when = $('evDate').value || null;
      var ins = await sb.from('venue_events').insert({venue_id: id, kind: kind, occurred_on: when, date_precision: 'day', detail: $('evDetail').value.trim() || null,
        source_url: $('evSrc').value.trim() || null, created_by: user.email}).select(EDITOR_EVENT_COLS.join(',')).single();
      if (ins.error) throw ins.error;
      (events[id] = events[id] || []).unshift(ins.data);
      if ($('evSet').checked && EVENT_SETS_STATUS[kind]){
        var p2 = {status: EVENT_SETS_STATUS[kind], status_since: when, status_date_precision: 'day'};
        if (kind === 'closed' || kind === 'ceased_live_music') p2.closed_on = when;
        if (kind === 'opened' && when) p2.opened_year = +when.slice(0, 4);
        if (kind === 'opened' || kind === 'reopened'){ p2.closed_on = null; p2.last_verified_on = TODAY; p2.verified_by = user.email; }
        await updateVenue(id, p2);
      }
      eventForm = false;
    } else if (a === 'delev'){
      var del = await sb.from('venue_events').delete().eq('id', id); if (del.error) throw del.error;
      Object.keys(events).forEach(function(k){ events[k] = events[k].filter(function(e){ return e.id !== id; }); });
    } else if (a === 'pub'){ await updateVenue(id, {published: !v.published});
    } else if (a === 'discard'){
      if (!confirm('Discard this draft? It is removed for everyone.')) return;
      var d = await sb.from('venues').delete().eq('id', id); if (d.error) throw d.error;
      venues = venues.filter(function(x){ return x.id !== id; }); sheet = null;
    } else if (a === 'saveNote'){
      var text = $('noteText').value.trim(); if (!text) return;
      var nr = await sb.from('venue_notes').insert({venue_id: id, note: text, created_by: user.email}).select('id,venue_id,note,created_at,created_by').single();
      if (nr.error) throw nr.error;
      (notes[id] = notes[id] || []).push(nr.data);
    }
  } catch (e){ alert('That did not save: ' + (e.message || e)); }
  render();
}

// ------------------------------------------------------------------ wiring
function nav(action){
  if (action === 'register'){ view = 'register'; sheet = null; render(); window.scrollTo(0, 0); }
  else if (action === 'closures'){ view = 'register'; sheet = null; render(); var c = $('closed'); if (c) c.scrollIntoView({block:'start'}); }
  else if (action === 'drafts'){ view = 'drafts'; sheet = null; render(); window.scrollTo(0, 0); }
  else if (action === 'method'){ openSheet({mode:'method'}); }
  else if (action === 'add'){ openSheet(editable() ? {mode:'add'} : {mode:'login', note:'Adding a venue requires an editor login.'}); }
  else if (action === 'login'){ openSheet({mode:'login'}); }
  else if (action === 'csv'){ downloadCsv(); }
  else if (action === 'signout'){ sb.auth.signOut().then(function(){ user = null; sheet = null; eventForm = false; view = 'register'; load(); }); }
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-nav]');
  if (t){ e.preventDefault(); nav(t.dataset.nav); return; }
  var o = e.target.closest('[data-open]');
  if (o){
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;   // let the browser open the route in a new tab
    e.preventDefault(); openSheet({mode:'detail', id: +o.dataset.open}); return;
  }
  var tg = e.target.closest('[data-toggle]');
  if (tg){ if (tg.dataset.toggle === 'seed') showSeed = true; if (tg.dataset.toggle === 'earlier') showEarlier = true; if (tg.dataset.toggle === 'sources') showAllSources = true; render(); return; }
  var b = e.target.closest('[data-band]'); if (b){ f.band = b.dataset.band; render(); return; }
  var a = e.target.closest('[data-age]'); if (a){ f.age = a.dataset.age; render(); return; }
  if (e.target.closest('[data-booking]')){ f.booking = !f.booking; render(); return; }
  if (e.target.closest('[data-clear]')){ f = {region:'', city:'', kind:'', band:'any', age:'any', booking:false}; render(); return; }
  if (e.target.closest('[data-close]')){ closeSheet(); return; }
  if (e.target.id === 'scrim'){ closeSheet(); return; }
  var act1 = e.target.closest('[data-act]');
  if (act1){ act(act1.dataset.act, act1.dataset.id ? +act1.dataset.id : null); return; }
  var d = e.target.closest('[data-delev]');
  if (d){ if (confirm('Remove this event?')) act('delev', +d.dataset.delev); return; }
  if (e.target.id === 'loginBtn'){ signIn(); }
});
document.addEventListener('change', function(e){
  if (e.target.id === 'regionSel'){ f.region = e.target.value; render(); }
  else if (e.target.id === 'citySel'){ f.city = e.target.value; render(); }
  else if (e.target.id === 'kindSel'){ f.kind = e.target.value; render(); }
});
document.addEventListener('keydown', function(e){
  if (!sheet) return;
  if (e.key === 'Escape'){ e.preventDefault(); closeSheet(); return; }
  if (e.key === 'Enter' && sheet.mode === 'login' && (e.target.id === 'email' || e.target.id === 'pass')){ e.preventDefault(); signIn(); return; }
  if (e.key === 'Tab'){   // keep focus inside the dialog
    var items = Array.prototype.slice.call($('sheet').querySelectorAll('a[href],button:not([disabled]),input,select,textarea')).filter(function(el){ return el.offsetParent !== null; });
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
async function signIn(){
  $('loginErr').hidden = true;
  var res = await sb.auth.signInWithPassword({email: $('email').value.trim(), password: $('pass').value});
  if (res.error){ $('loginErr').hidden = false; return; }
  user = res.data.user; sheet = null;
  load();
}
window.addEventListener('popstate', function(){ readUrl(); render(); });
async function boot(){
  var s = await sb.auth.getSession();
  user = s.data && s.data.session ? s.data.session.user : null;
  load();
}
boot();
</script>
</body>
</html>
